# Production overlay. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Differences from the base (dev) compose:
#   - Pulls pinned images from GHCR instead of building from source.
#   - Runs in the Production environment (Swagger off, HTTPS-aware).
#   - Does NOT publish api/mariadb/client ports to the host — only Caddy is exposed.
#   - Adds Caddy for automatic TLS (Let's Encrypt) in front of the client.
#   - Persists DataProtection keys so redeploys don't log everyone out.
#
# This overlay serves BOTH supported deployments. There is no separate localhost compose file:
# a private, machine-local deployment is this same overlay with a different env file
# (.env.localhost.example → .env.localhost), which changes exactly two things — CADDY_BIND, so
# Caddy binds loopback instead of 0.0.0.0, and ODYSSEY_DOMAIN, set to a *.localhost name so Caddy
# issues an internal certificate instead of going to Let's Encrypt:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.localhost up -d
#
# Splitting it into a second overlay was considered and rejected. Everything that actually protects
# a deployment — Production (Secure cookies, no Swagger, the real pseudonymization secret, no demo
# seed), the hardening blocks, the unpublished api/mariadb/client ports, the DataProtection keys
# volume — has to be identical in both, so a second file would be a copy that drifts. Keeping TLS in
# the localhost deployment is the point: it means CookieSecurePolicy.Always is satisfied by real
# https rather than by the browser's http://localhost secure-context exemption, which stops applying
# the moment anyone reaches the box by LAN IP. See docs/deployment.md, "Running Odyssey privately".
#
# IMAGE_TAG pins the release you are deploying (e.g. 1.4.0). Set it in .env.prod.
# GHCR_OWNER, IMAGE_TAG and ODYSSEY_DOMAIN carry `:?` guards for the same reason the
# credentials below do: an unset value here fails at deploy time with a message naming the
# variable, rather than resolving to an empty string and failing later as a confusing pull
# error or an empty Caddy site block.

services:
  mariadb:
    # No host port mapping in production — the DB is reachable only on the internal network.
    ports: !reset []
    environment:
      # Required in production (issue #451 §1.4). The base file falls back to `root_password` /
      # `odyssey_password` so a laptop needs no env file at all; without these guards the prod overlay
      # inherited those fallbacks silently. `:?` catches unset and empty — the CHANGE_ME case is caught
      # at app startup by PlaceholderConfigurationGuard, since compose interpolation cannot inspect a
      # value. MARIADB_ROOT_PASSWORD is guarded ONLY here: no host reads it, so there is no app-side
      # check that could.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set in your env file (openssl rand -base64 36)}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set in your env file (openssl rand -base64 36)}
    # Block privilege escalation via setuid binaries. Caps are left intact: the mariadb
    # entrypoint needs them (CHOWN/SETUID/…) to initialise the data dir on first start.
    security_opt:
      - no-new-privileges:true

  migrations:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in your env file (the GitHub user or org that owns the published images)}/odyssey-migrations:${IMAGE_TAG:?IMAGE_TAG must be set in your env file (the release to deploy, e.g. 1.4.0)}
    build: !reset null
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The name this host actually reads (Host.CreateApplicationBuilder ignores the ASPNETCORE one).
      # It MUST be pinned here rather than left to the base file: the base interpolates
      # `${ASPNETCORE_ENVIRONMENT:-Development}` from the ENV FILE, and this map is the container's
      # environment, so an overlay used without a matching .env.prod would otherwise run the
      # migrations job as Development in production. Same trap as the Swagger key above.
      DOTNET_ENVIRONMENT: Production
      # Pinned for the same reason, and it is the more dangerous of the two: nothing in the app
      # refuses the in-memory provider in Production (MigrationService/Program.cs reads the flag
      # and believes it), so a typo'd USE_IN_MEMORY_DATABASE=true in .env.prod would migrate a
      # throwaway database and report success while the real one was never touched.
      UseInMemoryDatabase: "false"
      # Never seed demo data in production (explicit guard on top of the environment gate).
      Seed__DemoData: "false"
      # No key ring here — see the base file. This job protects nothing, so mounting the API's keys
      # would only widen who can decrypt the stored credentials.
    # Runtime hardening: non-root .NET runner that needs no Linux capabilities and writes
    # nothing outside /tmp, so drop all caps and mount the root filesystem read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  api:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in your env file (the GitHub user or org that owns the published images)}/odyssey-api:${IMAGE_TAG:?IMAGE_TAG must be set in your env file (the release to deploy, e.g. 1.4.0)}
    build: !reset null
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The key the app actually reads (issue #451 §1.3). This map is the container's environment,
      # so `SWAGGER_ENABLED` here was inert: the base file's `Swagger__Enabled: ${SWAGGER_ENABLED:-true}`
      # is COMPOSE-level interpolation from the env file, and it only ever resolved to false because
      # .env.prod.example happens to set the variable. A hand-written .env.prod, a `docker run` or a
      # Kubernetes manifest got `:-true` and served Swagger UI in Production through the client's
      # nginx /api/ proxy. Program.cs now also refuses to enable Swagger in Production at all.
      Swagger__Enabled: "false"
      # Pinned, not left to the env file, for the same class of reason: DatabaseExtension.cs reads
      # this flag in every environment, so `true` in Production is an API serving an empty in-memory
      # database that loses everything on restart — with no error anywhere saying so.
      UseInMemoryDatabase: "false"
      # The Email__ClientBaseUrl guard is GONE (issue #8), and its removal is not a relaxation of what
      # it was protecting. It existed because the base file defaulted the value to
      # http://localhost:5199 for the laptop stack, and inheriting that in production produces mail
      # whose links are dead — the one failure a user cannot report, because the mail they cannot act
      # on is the one that would let them in. There is no such default to inherit any more: the base
      # file sets no Email__* at all, and the value is a settings row an administrator enters at
      # /settings. An unset one is EMPTY, which the sender handles by mailing the bare reset code
      # rather than a broken link.
      # No DataProtection__KeysPath here. The base file sets it, next to the dataprotection_keys
      # volume mount it has to agree with — one place, so the path and the mount cannot drift apart.
      #
      # The base file raises the identity rate limit to 300/minute for the E2E suites, which drive
      # that stack from one address and would otherwise exhaust the 30 the shipped default allows.
      # Compose merges environment maps, so without this reset that dev-only relaxation would land
      # in PRODUCTION — a tenfold weaker limit on the only unauthenticated write surface in the app
      # (/login, /register and the two mail routes), silently, as a side effect of a test fix.
      #
      # `!reset` rather than a literal 30: it drops the key entirely, so the value falls back to
      # appsettings.json, which is where the production number is actually decided. Pinning 30 here
      # would put the same number in two files that must agree — the duplication this overlay just
      # removed for DataProtection__KeysPath.
      RateLimiting__Identity__PermitLimit: !reset null
      # Legal__PseudonymizationSecret is GONE (issue #445 Wave 4). It lives in the encrypted secret
      # store and must be entered once at /settings → Credentials after this upgrade.
      #
      # Read this before upgrading an existing deployment: it is a DERIVATION key, so if consent rows
      # were already pseudonymized under the old environment value, the SAME value must be entered —
      # a different one leaves those rows permanently un-re-derivable, which is the property GDPR
      # Art. 7(1) attribution depends on. Export it from your current environment first.
      #
      # Its durability now rests on the dataprotection_keys volume the base file mounts AS WELL AS
      # the database backup. Back up both together; see docs/deployment.md.
    # Internal only — reached via the client's nginx /api/ proxy, never published to the host.
    ports: !reset []
    # Runtime hardening: non-root .NET app (UID 1654) that needs no caps. Root filesystem is
    # read-only; /tmp is a tmpfs and DataProtection keys live on the writable named volume the
    # base file mounts.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  client:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set in your env file (the GitHub user or org that owns the published images)}/odyssey-client:${IMAGE_TAG:?IMAGE_TAG must be set in your env file (the release to deploy, e.g. 1.4.0)}
    build: !reset null
    # Internal only — Caddy terminates TLS and proxies to this container.
    ports: !reset []
    expose:
      - "8080"
    # Runtime hardening: nginx-unprivileged (UID 101) on :8080 needs no caps. Root filesystem is
    # read-only; nginx's pid/temp/cache dirs are backed by tmpfs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  caddy:
    # Pinned to an exact patch, like the three Odyssey images above: `2-alpine` floats, so a
    # `docker compose pull` for an app upgrade could swap the TLS terminator underneath you at the
    # same time. Bump this deliberately. (2.11.4 is what `2-alpine` resolved to when it was pinned,
    # so this changed nothing at the time.)
    image: caddy:2.11.4-alpine
    container_name: odyssey-caddy
    restart: unless-stopped
    ports:
      # CADDY_BIND is the ONE line that separates the internet-facing deployment from the
      # localhost-only one — there is no second overlay, and deliberately so. Unset (.env.prod) it
      # resolves to "80:80", i.e. 0.0.0.0. Set to "127.0.0.1:" (.env.localhost) it resolves to
      # "127.0.0.1:80:80" and the stack is reachable only from the machine itself.
      #
      # The trailing colon belongs in the VALUE, not here: compose's port short syntax is
      # [HOST_IP:][HOST_PORT:]CONTAINER_PORT, so a bare "${CADDY_BIND}:80:80" would leave a leading
      # colon when the variable is empty and fail to parse. Keep the colon in .env.localhost.
      #
      # This is the only host-facing surface in the whole overlay — every other service resets its
      # ports to [] — so binding it to loopback is sufficient on its own to take the deployment off
      # the network. Do NOT also publish the client or api "just to check something": the client's
      # nginx trusts an inbound X-Forwarded-Proto (Odyssey.Client/nginx.conf), which is safe only
      # because Caddy is the sole path in and overwrites it.
      - "${CADDY_BIND:-}80:80"
      - "${CADDY_BIND:-}443:443"
    # Runtime hardening: drop all caps except the one Caddy needs to bind the privileged
    # TLS ports, and block privilege escalation. Root filesystem stays writable — Caddy
    # persists ACME state/certs under the /data and /config volumes.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Guarded like every credential in this file: unset, Caddy gets an empty site block and
      # serves nothing, with no error saying why.
      ODYSSEY_DOMAIN: ${ODYSSEY_DOMAIN:?ODYSSEY_DOMAIN must be set in your env file (the hostname Caddy issues a certificate for — your public domain, or odyssey.localhost for a private deployment)}
    depends_on:
      - client

volumes:
  caddy_data:
  caddy_config:
