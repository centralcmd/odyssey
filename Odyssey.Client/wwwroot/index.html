<!DOCTYPE html>
<!-- data-theme="dark" is Odyssey's own switch for every non-MudBlazor dark token (css/app.css).
     It defaults to dark, the default preference (UserPreferenceService); the head script below
     swaps in the viewer's last applied theme before first paint, and OdysseyThemeProvider then
     keeps it in step with MudThemeProvider.IsDarkMode through window.odysseyTheme. -->
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <script>
        // Pre-boot theme (issue #228): restore the theme window.odysseyTheme.set last applied in this
        // browser so a light-mode user gets no dark-token flash before WASM boots. The saved preference
        // itself lives server-side; this is only a per-viewer cache, so a missing or unreadable value
        // (private window, blocked storage) keeps the dark default.
        try {
            if (localStorage.getItem('odyssey-theme') === 'light') document.documentElement.removeAttribute('data-theme');
        } catch (e) { }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odyssey</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Self-hosted Roboto + Material Icons (see wwwroot/fonts). Served from our own origin so
         icons/fonts never depend on Google's CDN being reachable — which broke icons in prod
         and leaked user IPs to Google (GDPR). Loaded first so glyphs are ready for MudBlazor. -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/odyssey-components.css" />
    <link rel="stylesheet" href="css/legal.css" />
    <link rel="stylesheet" href="css/weather.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="icon" type="image/svg+xml" href="odyssey-logomark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="odyssey-favicon-16.png" />
    <link href="Odyssey.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script>
        window.odysseyTheme = {
            // Stamp (or clear) Odyssey's dark-mode attribute on the root element. MudBlazor 9.10
            // writes no data-theme itself, so OdysseyThemeProvider calls this whenever IsDarkMode
            // changes (issue #228). Light mode is the attribute's absence, never data-theme="light".
            // The applied value is also cached for the pre-boot script in <head>.
            set: function (dark) {
                if (dark) document.documentElement.setAttribute('data-theme', 'dark');
                else document.documentElement.removeAttribute('data-theme');
                try { localStorage.setItem('odyssey-theme', dark ? 'dark' : 'light'); } catch (e) { }
            }
        };
        window.downloadFileFromBytes = function (bytes, fileName, contentType) {
            const blob = new Blob([new Uint8Array(bytes)], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
        window.createBlobUrl = function (bytes, contentType) {
            const blob = new Blob([new Uint8Array(bytes)], { type: contentType });
            return URL.createObjectURL(blob);
        };
        window.downloadFromUrl = function (url, fileName) {
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
        window.revokeBlobUrl = function (url) {
            URL.revokeObjectURL(url);
        };
        window.odsSetAttr = function (elementId, name, value) {
            // Set (or remove, when value is null or empty) an attribute on an element by id. Used to wire
            // aria-describedby or aria-label onto a MudBlazor input whose own attribute rendering would
            // otherwise clobber a splatted value (OdsCustodianSelect, OdsSelect, OdsDatePicker → the inner
            // input). The one definition: a second, later one used to win silently.
            const el = document.getElementById(elementId);
            if (!el) return;
            if (value === null || value === undefined || value === '') el.removeAttribute(name);
            else el.setAttribute(name, value);
        };
        window.odsFocusById = function (elementId) {
            // Restore focus to a control by id — used after an action unmounts the element that had
            // focus (e.g. dismissing/applying a match-suggestion chip), so focus never falls to <body>.
            const el = document.getElementById(elementId);
            if (el) el.focus();
        };
        window.odsFocusInPopover = function (elementId, first) {
            // Move focus into a freshly opened OdsPopupMenu panel (issue #255): the element with this
            // id, or — when `first` — the first focusable control inside it (the Tab sentinels are
            // skipped: focusable, but not controls). A MudPopover renders at top:-9999px until its
            // JS places it, and focusing anything in it before then scrolls the page to the top, so
            // this waits (up to ~30 frames) for the popover to be placed first.
            const FOCUSABLE = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"]):not([data-popmenu-sentinel])';
            let frames = 0;
            const attempt = () => {
                const host = document.getElementById(elementId);
                if (!host) return;
                const popover = host.closest('.mud-popover');
                const placed = !popover || popover.getBoundingClientRect().top > -1000;
                if (!placed && frames++ < 30) { requestAnimationFrame(attempt); return; }
                if (!first) { host.focus(); return; }
                const el = host.querySelector(FOCUSABLE);
                if (el) { el.focus(); return; }
                if (!host.hasAttribute('tabindex')) host.setAttribute('tabindex', '-1');
                host.focus();
            };
            requestAnimationFrame(attempt);
        };
        window.odsFocusIfLost = function (triggerId, panelId) {
            // OdsPopupMenu's click-away close (issue #255). The overlay is modeless, so the click
            // also lands on what was clicked; if that was a control, it has focus and must keep it.
            // Only when focus was LOST — to <body> (empty space, or the focused control unmounting
            // with the panel) or still inside the closing panel — does it go back to the trigger.
            // Checked on the next frame, after the click's own mousedown focus change.
            requestAnimationFrame(() => {
                const active = document.activeElement;
                const panel = document.getElementById(panelId);
                const lost = !active || active === document.body || (panel && panel.contains(active));
                if (!lost) return;
                const trigger = document.getElementById(triggerId);
                if (trigger) trigger.focus();
            });
        };
        window.odsSetInputValue = function (id, value) {
            // Put an input's DOM value back to what the component holds. A keystroke the component
            // REJECTS leaves its bound value unchanged, so Blazor's diff has nothing to write and the
            // stray character would linger in the field — this is the only way to take it back out
            // (OdsMoneyField: a second decimal separator, a non-leading minus, a typed sign).
            const el = document.getElementById(id);
            if (el && el.value !== value) el.value = value;
        };
        window.odsActiveElementId = function () {
            // Id of whatever currently has focus, or null — lets a Blazor keydown handler work out
            // where a roving-focus list is without holding element references (OdsMoneyField's
            // currency listbox).
            const el = document.activeElement;
            return el && el.id ? el.id : null;
        };
        window.odsComboboxKeys = function (id) {
            // Keyboard glue for a combobox over an inline listbox (DS AddLocationModal):
            // - the first Esc in a filled input clears it and only the next one reaches the dialog. MudDialog
            //   closes on its own Esc listener before any Blazor handler runs, so the stop has to happen here;
            //   the cleared value goes back to Blazor through an ordinary input event;
            // - while the list is open, ArrowUp/ArrowDown/Enter keep their default (caret jumps) from firing.
            //   Blazor's @onkeydown:preventDefault is fixed at render time and cannot depend on the key.
            const el = document.getElementById(id);
            if (!el || el.dataset.odsComboboxKeys) return;
            el.dataset.odsComboboxKeys = '1';
            el.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && el.value) {
                    e.stopPropagation();
                    e.preventDefault();
                    el.value = '';
                    el.dispatchEvent(new Event('input', { bubbles: true }));
                } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')
                    && el.getAttribute('aria-expanded') === 'true') {
                    e.preventDefault();
                }
            });
        };
        window.odsScrollIntoViewById = function (id) {
            // Bring a keyboard-active option into its scrolling list's view (WCAG 2.4.7), moving no further
            // than needed.
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ block: 'nearest' });
        };
        window.odsSetIndeterminate = function (el, value) {
            // The checkbox "mixed" (select-all) state is a DOM property, not an attribute, so Blazor
            // can't set it declaratively — reflect it here so assistive tech announces "mixed".
            if (el) el.indeterminate = !!value;
        };
        // Focus-restore stack for OdsModal (WCAG 2.4.3): a plain array of the elements that had
        // focus just before each currently-open dialog stole it, keyed purely by open order (LIFO),
        // so nested dialogs unwind correctly. Lives entirely on the JS side — Blazor never needs to
        // hold the DOM reference, only call capture on open and restore on close, in that order.
        window.odsFocusOwnerStack = [];
        window.odsCaptureFocusOwner = function () {
            window.odsFocusOwnerStack.push(document.activeElement);
        };
        window.odsRestoreFocusOwner = function (preferredId) {
            const el = window.odsFocusOwnerStack.pop();
            // An explicit return target wins (OdsModal ReturnFocusToId): a row-menu item that opened
            // the dialog unmounted with its popover, so the captured owner is gone. Then the owner if
            // it is still in the DOM, then the page heading — never <body>.
            const focusable = function (n) { return n && document.contains(n) && typeof n.focus === 'function'; };
            if (preferredId) {
                const host = document.getElementById(preferredId);
                const target = host && (host.matches('button, a[href], input, select, textarea, [tabindex]')
                    ? host : host.querySelector('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'));
                if (focusable(target)) { target.focus(); return; }
            }
            if (focusable(el) && el !== document.body) { el.focus(); return; }
            if (preferredId) {
                const h1 = document.querySelector('main h1, h1');
                if (h1) { if (!h1.hasAttribute('tabindex')) h1.setAttribute('tabindex', '-1'); h1.focus(); }
            }
        };
        window.odsFocusDialogCancel = function () {
            // OdsModal InitialFocus="Cancel": a destructive confirmation opens on its safe choice — the
            // element marked data-dialog-cancel, else the footer's first button (Cancel sits left of
            // the action). Same two frames as odsFocusFirstField, so MudBlazor's focus trap runs first.
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    const dialogs = document.querySelectorAll('.ods-modal');
                    const dialog = dialogs[dialogs.length - 1];
                    if (!dialog) return;
                    const el = dialog.querySelector('[data-dialog-cancel]') ||
                        dialog.querySelector('.ods-modal-foot button:not([disabled])');
                    if (el) el.focus();
                });
            });
        };
        window.odsFocusFirstIn = function (id, fallbackToSelf, frames) {
            // Focus the first focusable control inside an element (OdsRecordTable panel / menu
            // trigger), else the element itself when asked. `frames` defers the move so it lands
            // after another focus change in flight (a closing menu restoring its trigger).
            const FOCUSABLE = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
            const run = function () {
                const host = document.getElementById(id);
                if (!host) return;
                const el = Array.from(host.querySelectorAll(FOCUSABLE)).find(function (e) { return e.offsetParent !== null; });
                if (el) { el.focus(); return; }
                if (fallbackToSelf) host.focus();
            };
            let n = frames || 0;
            const tick = function () { if (n-- > 0) requestAnimationFrame(tick); else run(); };
            tick();
        };
        window.odsRecTrackClicks = function (tableId) {
            // OdsRecordTable: a row click is ignored when it started inside an interactive element.
            // Blazor's MouseEventArgs carries no target, so a capture-phase listener records whether
            // the latest click did, and the row handler asks right after.
            const table = document.getElementById(tableId);
            if (!table || table.dataset.recTracked) return;
            table.dataset.recTracked = '1';
            table.addEventListener('click', function (e) {
                const t = e.target;
                const hit = t && t.closest && t.closest('input, button, a, select, textarea, label, [role="switch"], [role="menuitem"]');
                table.dataset.recInteractive = hit && table.contains(hit) ? '1' : '0';
            }, true);
        };
        window.odsRecClickWasInteractive = function (tableId) {
            const table = document.getElementById(tableId);
            return !!table && table.dataset.recInteractive === '1';
        };
        window.odsFocusFirstField = function () {
            // Autofocus the first form field when an OdsModal opens (Odyssey DS · Modal):
            // focus the first focusable control inside the topmost dialog body, skipping
            // the header close button. Two rAFs let MudBlazor's own focus trap run first
            // so this override lands the focus. No-ops for bodyless viewer modals and when
            // a field already grabbed focus.
            const FOCUSABLE = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    const bodies = document.querySelectorAll('.ods-modal-body');
                    const body = bodies[bodies.length - 1];
                    if (!body || body.contains(document.activeElement)) return;
                    const el = Array.from(body.querySelectorAll(FOCUSABLE)).find(function (e) { return e.offsetParent !== null; });
                    if (el) el.focus();
                });
            });
        };
    </script>
</body>

</html>
