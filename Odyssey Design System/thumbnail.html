<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans,'Roboto',sans-serif)}
  .main{flex:1;background:#006B5A;display:flex;align-items:center;justify-content:center}
  .main .name{font-weight:var(--fw-light,300);font-size:190px;letter-spacing:-6px;color:#00F5D4;line-height:1}
  .strip{width:22%;display:flex;flex-direction:column}
  .strip span{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="name">Odyssey</div></div>
  <div class="strip">
    <span style="background:#00F5D4"></span>
    <span style="background:#38BDF8"></span>
    <span style="background:#FF6B6B"></span>
    <span style="background:#8B5CF6"></span>
  </div>
</div>
</body>
</html>
