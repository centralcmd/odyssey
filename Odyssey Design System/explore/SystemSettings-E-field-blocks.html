<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>System settings · E — Field blocks</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<link rel="stylesheet" href="../ui_kits/web/kit.css" />
<link rel="stylesheet" href="explore.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="../ui_kits/web/system-settings-data.js"></script>
<script type="text/babel" src="settings-explore-common.js"></script>
<style>
.exe-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;padding:18px 20px;}
.exe-cell{min-width:0;}
.exe-cell.span{grid-column:1/-1;}
.exe-lbl{display:flex;align-items:center;gap:6px;min-width:0;}
.exe-lbl-t{font:500 12.5px/1.35 var(--font-sans);color:var(--mud-palette-text-secondary);}
.exe-meta{display:flex;align-items:center;gap:5px;margin-top:6px;font:400 11px/1.3 var(--font-sans);color:var(--mud-palette-text-secondary);}
.exe-meta .material-icons{font-size:12px;opacity:.75;}
.exe-meta b{font-weight:600;color:var(--mud-palette-text-primary);}
.exe-meta.none{opacity:.65;font-style:italic;}
.exe-desc{font:400 12.5px/1.5 var(--font-sans);color:var(--mud-palette-text-secondary);margin-top:7px;padding-left:11px;border-left:2px solid var(--brand-border);text-wrap:pretty;}

/* --- mode: notched outline (MudBlazor Variant.Outlined) --- */
.exe-f fieldset{margin:0;min-width:0;border:1px solid var(--mud-palette-lines-inputs,var(--mud-palette-divider));border-radius:8px;padding:0 12px 11px;background:var(--mud-palette-background);transition:border-color var(--duration-fast,.12s) var(--ease-standard,ease),box-shadow var(--duration-fast,.12s) var(--ease-standard,ease);}
.exe-f fieldset:focus-within{border-color:var(--mud-palette-primary);border-width:2px;padding:0 11px 10px;}
.exe-f .exe-ctrl .odc-input:focus,.exe-f .exe-ctrl .odc-input:focus-visible{outline:none!important;box-shadow:none!important;}
.exe-f fieldset.err{border-color:var(--mud-palette-error);}
.exe-f legend{padding:0 6px;margin-left:2px;background:transparent;}
.exe-f .exe-lbl-t{font:400 11.5px/1.2 var(--font-sans);color:var(--mud-palette-text-secondary);}
.exe-f fieldset:focus-within .exe-lbl-t{color:var(--mud-palette-primary);}
.exe-f .exe-ctrl{margin-top:2px;}
.exe-f .exe-ctrl .odc-field,.exe-f .exe-ctrl .ex-num{width:100%;min-width:0;}
.exe-f .exe-ctrl .ex-numwrap{align-items:stretch;}
.exe-f .exe-ctrl .odc-input{border:0!important;background:transparent!important;padding:0!important;height:auto!important;min-height:0!important;font:400 15px/1.5 var(--font-sans)!important;}
.exe-f .exe-ctrl .odc-input.has-unit{padding-right:44px!important;}
.exe-f .exe-ctrl .odc-input-wrap{border:0!important;background:transparent!important;padding:0!important;}
.exe-f .exe-ctrl .odc-input-unit{right:0!important;}
.exe-f .exe-ctrl .odc-field-help{display:none;}
.exe-f .exe-ctrl .odc-capacity{gap:10px;}
.exe-cap{display:flex;align-items:center;gap:10px;}
.exe-cap .odc-field,.exe-cap .ex-num{flex:1;width:auto!important;min-width:0;}
.exe-cap .ex-numwrap{flex:1;align-items:stretch;}
.exe-cap-nl{flex:1;font:400 15px/1.5 var(--font-sans);color:var(--mud-palette-text-secondary);text-align:right;}
.exe-cap-btn{flex:none;border:1px solid var(--mud-palette-divider);background:transparent;border-radius:999px;padding:4px 11px;font:500 11px/1.2 var(--font-sans);color:var(--mud-palette-text-secondary);cursor:pointer;white-space:nowrap;}
.exe-cap-btn:hover{border-color:var(--mud-palette-lines-inputs,var(--mud-palette-divider));color:var(--mud-palette-text-primary);}
.exe-cap-btn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-border);color:var(--brand-text);}
.exe-f .exe-ctrl .odc-capacity-nolimit{border:0;background:transparent;padding:0;font:400 15px/1.5 var(--font-sans);}

/* helper line under the field: description + last-changed, plain text */
.exe-help{margin:5px 0 0;padding-left:14px;font:400 11.5px/1.55 var(--font-sans);color:var(--mud-palette-text-secondary);text-wrap:pretty;}
.exe-help .stamp{opacity:.8;}
.exe-err{margin:4px 0 0;padding-left:14px;font:400 11.5px/1.4 var(--font-sans);color:var(--mud-palette-error);}
.exe-range{font:400 11px/1.3 var(--font-mono);color:var(--mud-palette-text-secondary);}
.exe-help-sep{width:1px;height:10px;background:var(--mud-palette-divider);}


/* switch + action blocks read as one tile */
.exe-tile{display:flex;align-items:center;gap:16px;justify-content:space-between;border:1px solid var(--mud-palette-lines-inputs,var(--mud-palette-divider));border-radius:8px;background:var(--mud-palette-background);padding:12px 14px;}
.exe-tile .exe-lbl-t{font-size:13.5px;color:var(--mud-palette-text-primary);font-weight:500;}
.exe-tile-l{min-width:0;}
@media (max-width:900px){.exe-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { MIcon, SearchField, PageHeader, NumberField } = window.OdysseyDesignSystem_d5aa51;

// The processor-disclosure note used to sit above the four File-analysis rows.
// Its weight belongs to each value, so it is folded into their helper text.
const EXE_EXTRA = {
  aiProcessor: 'Shown to every user at the consent gate and recorded on each analysis job — GDPR Art. 13(1)(e). Odyssey can only advise on the name, not verify it. Every change is written to the audit log.',
  aiProcessorRegion: 'Shown at the consent gate and recorded on each job — GDPR Chapter V. Odyssey cannot verify the region at all. Every change is written to the audit log.',
  aiLawfulBasis: 'Shown at the consent gate under the affirmation and recorded on each job. Every change is written to the audit log.',
  aiPrivacyNoticeUrl: 'Linked at the consent gate — GDPR Art. 13(1)(e). Odyssey checks the URL. Every change is written to the audit log.',
};

const Helper = ({ r, range, inTile }) => {
  const stamp = r.meta ? `Last changed by ${r.meta.by}, ${r.meta.on}.` : 'Never changed — default value.';
  const extra = EXE_EXTRA[r.key];
  return (
    <div className="exe-help" style={inTile ? { paddingLeft: 0, marginTop: 4 } : undefined}>
      {r.desc}{extra ? ' ' + extra : ''}{range ? ` Can be lowered but not raised: ${range}.` : ''} <span className="stamp">{stamp}</span>
    </div>
  );
};

// The capacity cap as ONE line inside the outlined frame: the value, and a
// compact "No limit" pill at the trailing edge that swaps the value out for the
// word (the entered number is retained).
function Capacity({ r, d }) {
  const c = d.vals[r.key];
  const err = d.errorFor(r) || undefined;
  return (
    <div className="exe-cap">
      {c.unlimited
        ? <span className="exe-cap-nl">No limit</span>
        : <div className="ex-numwrap"><NumberField className="ex-num" id={`ex-in-${r.key}`} value={c.value}
            min={r.min} max={r.max} step={1} align="right" error={err}
            ariaLabelledBy={`ex-ttl-${r.key}`} onChange={(v) => d.setCapValue(r.key, v)} /></div>}
      <button type="button" className="exe-cap-btn" aria-pressed={c.unlimited}
        onClick={() => d.setCapUnlimited(r.key, !c.unlimited)}>{c.unlimited ? 'Set a limit' : 'No limit'}</button>
    </div>
  );
}

function Field({ r, d }) {
  const dirty = d.dirtyRow(r);
  const err = d.errorFor(r);
  // Tighten-only rows carry their effective range in the helper slot — the DS
  // field's own help line is suppressed inside the notched frame.
  const range = r.ceiling != null ? `${exFmt(r.min)}–${exFmt(r.ceiling)}` : null;
  if (r.type === 'switch' || r.type === 'export') {
    return (
      <div className="exe-cell span exe-f">
        <div className="exe-tile">
          <div className="exe-tile-l">
            <div className="exe-lbl">
              <span className="exe-lbl-t" id={`ex-ttl-${r.key}`}>{r.title}</span>
              {dirty ? <span className="ex-dot" aria-hidden="true" /> : null}
            </div>
            <Helper r={r} range={null} inTile />
          </div>
          <ExControl row={r} d={d} />
        </div>
      </div>
    );
  }
  return (
    <div className={`exe-cell${r.type === 'text' ? ' span' : ''} exe-f`}>
      <fieldset className={err ? 'err' : undefined}>
        <legend>
          <span className="exe-lbl-t" id={`ex-ttl-${r.key}`}>{r.title}</span>
        </legend>
        <div className="exe-ctrl">{EX_CAP[r.type] ? <Capacity r={r} d={d} /> : <ExControl row={r} d={d} />}</div>
      </fieldset>
      {err ? <div className="exe-err">{err}</div> : null}
      <Helper r={r} range={range} />
    </div>
  );
}

function SectionCard({ g, d }) {
  const rt = d.rtFor(g);
  const dirty = d.dirtyIn(g);
  return (
    <section className="gcard" aria-labelledby={`exe-g-${g.group}`}>
      <header className="gcard-h">
        <span className="gcard-ic"><MIcon name={g.icon} size={17} /></span>
        <h2 className="gcard-t" id={`exe-g-${g.group}`}>{g.group}</h2>
        {dirty > 0
          ? <span className="gcard-badge" style={{ marginLeft: 'auto' }}>{dirty} unsaved</span>
          : <span className="gcard-count">{g.rows.length} settings</span>}
      </header>
      {rt ? (
        <div className="gcard-alert" id={`ex-rt-${g.group}`} role="alert" tabIndex={-1}>
          <span className="material-icons" aria-hidden="true">error_outline</span>
          <div>{rt}</div>
        </div>
      ) : null}
      <div className="exe-grid">
        {g.rows.map(r => <Field key={r.key} r={r} d={d} />)}
      </div>
    </section>
  );
}

function App() {
  const d = useExDraft();
  const [q, setQ] = React.useState('');
  const t = q.trim().toLowerCase();
  const groups = SS_GROUPS
    .map(g => ({ ...g, rows: t ? g.rows.filter(r => (r.title + ' ' + r.desc + ' ' + g.group).toLowerCase().includes(t)) : g.rows }))
    .filter(g => g.rows.length);
  return (
    <div className="ex-wrap">
      <div className="ex-banner">
        <b>Direction E</b>
        <div>One setting = one outlined field, the MudBlazor <b style={{ font: 'inherit', color: 'inherit' }}>Variant.Outlined</b> shape: the label sits on the outline, and the helper text underneath carries the description and the last-changed stamp as plain text. Two settings per line where the control is narrow; switches and the export action stay full-width tiles.</div>
      </div>
      <PageHeader
        title="System settings"
        icon="settings"
        sub="Instance-wide configuration for this Odyssey deployment"
        searchDefaultOpen
        search={(
          <div style={{ flex: 1, minWidth: 280 }}>
            <SearchField placeholder="Search settings…" value={q} onChange={setQ} />
          </div>
        )}
        primary={<ExSaveBar d={d} />}
      />
      {groups.length ? (
        <div className="exc-stack">{groups.map(g => <SectionCard key={g.group} g={g} d={d} />)}</div>
      ) : (
        <div className="ex-empty">Nothing matches “{q.trim()}”.</div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
