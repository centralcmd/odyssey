<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>System settings · B — Section rail</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<link rel="stylesheet" href="explore.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="../ui_kits/web/system-settings-data.js"></script>
<script type="text/babel" src="settings-explore-common.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { MIcon, SearchField } = window.OdysseyDesignSystem_d5aa51;

// One line of prose per section — what this group of settings governs. In the
// shipped page this would live beside the catalogue declaration.
const EXB_BLURB = {
  'Security': 'How accounts are admitted to this deployment. Changes take effect at the next sign-in attempt.',
  'File analysis': 'What users are told before a document is sent for analysis, and the bounds the extraction runs under.',
  'Email': 'Sender identity on transactional mail, and the throttle that bounds password-reset flooding.',
  'Data': 'Upload ceiling and the full-database export.',
  'Insurance': 'Volume caps on policies, renewals and attachments.',
  'Contracts': 'Volume caps on parties, attachments and the summary roll-up.',
  'Photos': 'Volume caps on photo links and album membership.',
  'Journal limits': 'How many records one journal entry or task may link to.',
  'Contacts import & export': 'vCard round-trip: how many contacts, and how large a file, may cross the boundary.',
  'Calendars import & export': 'iCalendar round-trip for events.',
  'Tasks import & export': 'iCalendar round-trip for tasks.',
  'Journal import & export': 'iCalendar round-trip for journal entries.',
};

function Pane({ g, d }) {
  const rt = d.rtFor(g);
  return (
    <div className="exb-pane">
      <div className="exb-panehead">
        <span className="gcard-ic" style={{ width: 34, height: 34, borderRadius: 9 }}><MIcon name={g.icon} size={19} /></span>
        <div>
          <h2>{g.group}</h2>
          <p>{EXB_BLURB[g.group]}</p>
        </div>
      </div>
      {g.note ? (
        <div className="gcard-note" role="note" style={{ border: '1px solid var(--mud-palette-divider)', borderRadius: 12 }}>
          <span className="material-icons" aria-hidden="true">{g.note.icon}</span>
          <div>{g.note.body}</div>
        </div>
      ) : null}
      {rt ? (
        <div className="gcard-alert" id={`ex-rt-${g.group}`} role="alert" tabIndex={-1}
          style={{ border: '1px solid var(--mud-palette-error)', borderRadius: 12 }}>
          <span className="material-icons" aria-hidden="true">error_outline</span>
          <div>{rt}</div>
        </div>
      ) : null}
      <div className="exb-card">
        {g.rows.map(r => (
          <div key={r.key} className={`exb-row${exWide(r) ? ' wide' : ''}`}>
            <div>
              <div className="exb-ttl" id={`ex-ttl-${r.key}`}>
                {r.title}
                {d.dirtyRow(r) ? <span className="ex-dot" title="Unsaved change" aria-hidden="true" /> : null}
              </div>
              <div className="exb-desc">{r.desc}</div>
              {r.meta ? (
                <div className="exb-meta"><span className="material-icons" aria-hidden="true">history</span>
                  Last changed by <b>{r.meta.by}</b> on {r.meta.on}</div>
              ) : null}
            </div>
            <div className="exb-ctrl"><ExControl row={r} d={d} /></div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const d = useExDraft();
  const [sel, setSel] = React.useState(SS_GROUPS[0].group);
  const [q, setQ] = React.useState('');
  const t = q.trim().toLowerCase();
  const hits = t ? SS_GROUPS.flatMap(g => g.rows
    .filter(r => (r.title + ' ' + r.desc + ' ' + g.group).toLowerCase().includes(t))
    .map(r => ({ g, r }))) : [];
  const group = SS_GROUPS.find(g => g.group === sel) || SS_GROUPS[0];
  const open = (g, r) => { setSel(g.group); setQ(''); setTimeout(() => { const el = document.getElementById(`ex-in-${r.key}`); if (el) el.focus(); }, 60); };
  return (
    <div className="ex-wrap">
      <div className="ex-banner">
        <b>Direction B</b>
        <div>One section at a time, chosen from a rail. Nothing scrolls past a screen or two, the rail carries where-am-I plus unsaved and error counts per section, and search becomes a jump list rather than a filter over a 42-row page. Rows keep their full descriptions and per-row history because there is room for them.</div>
      </div>
      <header className="ex-head">
        <div className="ex-head-l">
          <span className="ex-head-ic"><MIcon name="settings" size={20} /></span>
          <div>
            <h1>System settings</h1>
            <p>Instance-wide configuration for this Odyssey deployment</p>
          </div>
        </div>
        <div className="ex-head-r">
          <div className="ex-search"><SearchField placeholder="Search all settings…" value={q} onChange={setQ} /></div>
          <ExSaveBar d={d} />
        </div>
      </header>
      <div className="exb-split">
        <nav className="exb-rail" aria-label="Settings sections">
          <div className="exb-railcap">12 sections · 42 settings</div>
          {SS_GROUPS.map(g => {
            const dirty = d.dirtyIn(g), errs = d.errorsIn(g);
            return (
              <button key={g.group} type="button" className={`exb-nav${g.group === sel && !t ? ' active' : ''}`}
                aria-current={g.group === sel ? 'true' : undefined} onClick={() => { setSel(g.group); setQ(''); }}>
                <span className="material-icons" aria-hidden="true">{g.icon}</span>
                <span className="exb-navlbl">{g.group}</span>
                {errs > 0 ? <span className="exb-naverr" title={`${errs} problems`} /> : null}
                {dirty > 0 ? <span className="exb-navdot" title={`${dirty} unsaved`} /> : null}
                <span className="exb-navn">{g.rows.length}</span>
              </button>
            );
          })}
        </nav>
        {t ? (
          <div className="exb-pane">
            <div className="exb-panehead"><div>
              <h2>{hits.length} {hits.length === 1 ? 'setting' : 'settings'} match “{q.trim()}”</h2>
              <p>Pick one to open its section with the control focused.</p>
            </div></div>
            <div className="exb-hits">
              {hits.map(({ g, r }) => (
                <button key={r.key} type="button" className="exb-hit" onClick={() => open(g, r)}>
                  <span className="exb-hit-sec">{g.group}</span>
                  <span className="exb-hit-ttl">{r.title}</span>
                </button>
              ))}
              {hits.length === 0 ? <div className="ex-empty">Nothing matches.</div> : null}
            </div>
          </div>
        ) : <Pane g={group} d={d} />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
