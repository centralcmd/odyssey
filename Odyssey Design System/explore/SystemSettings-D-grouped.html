<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>System settings · D — Grouped cards</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<link rel="stylesheet" href="../ui_kits/web/kit.css" />
<link rel="stylesheet" href="explore.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="../ui_kits/web/system-settings-data.js"></script>
<script type="text/babel" src="settings-explore-common.js"></script>
<style>
.exd-row{position:relative;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:14px 20px;}
.exd-row:hover{background:rgba(255,255,255,.014);}
.exd-row+.exd-row::before{content:'';position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--mud-palette-divider);}
.exd-ctrl .odc-field:not(.ex-num):not(.odc-capacity-num){width:280px;}
.exd-ctrl .odc-input{text-overflow:ellipsis;}
.exd-l{min-width:0;}
.exd-ttl{display:flex;align-items:center;gap:6px;font:500 13.5px/1.4 var(--font-sans);}
.exd-desc{grid-column:1/-1;font:400 12.5px/1.55 var(--font-sans);color:var(--mud-palette-text-secondary);max-width:80ch;text-wrap:pretty;padding:2px 0 2px;border-left:2px solid var(--brand-border);padding-left:11px;margin-top:2px;}
.exd-meta{display:flex;align-items:center;gap:5px;margin-top:4px;font:400 11.5px/1.3 var(--font-sans);color:var(--mud-palette-text-secondary);}
.exd-meta .material-icons{font-size:13px;opacity:.75;}
.exd-meta b{font-weight:600;color:var(--mud-palette-text-primary);}
.exd-meta.none{opacity:.7;font-style:italic;}
.exd-switch{display:flex;align-items:center;gap:8px;margin-left:auto;}
.exd-switch-lbl{font:600 10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mud-palette-text-secondary);}
.exd-seg{display:inline-flex;padding:3px;gap:2px;border-radius:8px;background:var(--mud-palette-surface);border:1px solid var(--mud-palette-divider);}
.exd-seg-btn{border:0;background:transparent;cursor:pointer;padding:5px 11px;border-radius:6px;font:500 11.5px/1 var(--font-sans);color:var(--mud-palette-text-secondary);}
.exd-seg-btn.active{background:var(--brand-soft);color:var(--brand-text);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { MIcon, SearchField, PageHeader } = window.OdysseyDesignSystem_d5aa51;

const matrixOf = (g) => {
  if (!g.roundTrip) return null;
  const pick = (type, dir) => g.rows.find(r => r.type === type && r.key.indexOf(dir) > -1);
  const m = { countImport: pick('capacity', 'Import'), countExport: pick('capacity', 'Export'),
    sizeImport: pick('size', 'Import'), sizeExport: pick('size', 'Export') };
  return Object.values(m).every(Boolean) ? m : null;
};
const MATRIX_LBL = {
  'Contacts import & export': ['Contacts per file', 'vCard (.vcf) file size'],
  'Calendars import & export': ['Events per file', 'iCalendar (.ics) file size'],
  'Tasks import & export': ['Tasks per file', 'iCalendar (.ics) file size'],
  'Journal import & export': ['Entries per file', 'iCalendar (.ics) file size'],
};

function Meta({ r }) {
  return r.meta
    ? <div className="exd-meta"><span className="material-icons" aria-hidden="true">history</span>Last changed by <b>{r.meta.by}</b> on {r.meta.on}</div>
    : <div className="exd-meta none"><span className="material-icons" aria-hidden="true">history</span>Never changed — default value</div>;
}

function Row({ r, d }) {
  const [why, setWhy] = React.useState(false);
  return (
    <div className="exd-row">
      <div className="exd-l">
        <div className="exd-ttl" id={`ex-ttl-${r.key}`}>
          {r.title}
          <button type="button" className={`exc-why${why ? ' on' : ''}`} aria-expanded={why}
            aria-label={`What “${r.title}” does`} onClick={() => setWhy(w => !w)}>
            <span className="material-icons" aria-hidden="true">help_outline</span>
          </button>
          {d.dirtyRow(r) ? <span className="ex-dot" title="Unsaved change" aria-hidden="true" /> : null}
        </div>
        <Meta r={r} />
      </div>
      <div className="exd-ctrl"><ExControl row={r} d={d} /></div>
      {why ? <div className="exd-desc">{r.desc}</div> : null}
    </div>
  );
}

// The matrix keeps the per-row history: each cell carries its own stamp under
// the control, so "every row" survives the collapse.
function Matrix({ g, m, d }) {
  const [countLbl, sizeLbl] = MATRIX_LBL[g.group];
  const cell = (r) => (
    <div className="exc-mcell" key={r.key} style={{ flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
      <div className="exd-ttl" id={`ex-ttl-${r.key}`} style={{ display: 'none' }}>{r.title}</div>
      <ExControl row={r} d={d} />
      <Meta r={r} />
    </div>
  );
  return (
    <div className="exc-matrix">
      <div className="exc-mgrid">
        <div />
        <div className="exc-mhead">Per import</div>
        <div className="exc-mhead">Per export</div>
        <div className="exc-mrule" />
        <div className="exc-mlbl">{countLbl}<span>Rejected above this count. “No limit” keeps that direction unbounded.</span></div>
        {cell(m.countImport)}{cell(m.countExport)}
        <div className="exc-mlbl">{sizeLbl}<span>Above ~64 MB, also raise the reverse proxy’s body-size limit.</span></div>
        {cell(m.sizeImport)}{cell(m.sizeExport)}
      </div>
    </div>
  );
}

function SectionCard({ g, d, matrix, filtered }) {
  const rt = d.rtFor(g);
  const dirty = d.dirtyIn(g);
  const m = matrix && !filtered ? matrixOf(g) : null;
  return (
    <section className="gcard" aria-labelledby={`exd-g-${g.group}`}>
      <header className="gcard-h">
        <span className="gcard-ic"><MIcon name={g.icon} size={17} /></span>
        <h2 className="gcard-t" id={`exd-g-${g.group}`}>{g.group}</h2>
        {dirty > 0
          ? <span className="gcard-badge" style={{ marginLeft: 'auto' }}>{dirty} unsaved</span>
          : <span className="gcard-count">{g.rows.length} settings</span>}
      </header>
      {g.note ? (
        <div className="gcard-note" role="note">
          <span className="material-icons" aria-hidden="true">{g.note.icon}</span>
          <div>{g.note.body}</div>
        </div>
      ) : null}
      {rt ? (
        <div className="gcard-alert" id={`ex-rt-${g.group}`} role="alert" tabIndex={-1}>
          <span className="material-icons" aria-hidden="true">error_outline</span>
          <div>{rt}</div>
        </div>
      ) : null}
      {m ? <Matrix g={g} m={m} d={d} /> : <div>{g.rows.map(r => <Row key={r.key} r={r} d={d} />)}</div>}
    </section>
  );
}

function App() {
  const d = useExDraft();
  const [q, setQ] = React.useState('');
  const [matrix, setMatrix] = React.useState(true);
  const t = q.trim().toLowerCase();
  const groups = SS_GROUPS
    .map(g => ({ ...g, rows: t ? g.rows.filter(r => (r.title + ' ' + r.desc + ' ' + g.group).toLowerCase().includes(t)) : g.rows }))
    .filter(g => g.rows.length);
  return (
    <div className="ex-wrap">
      <div className="ex-banner">
        <b>Direction D</b>
        <div>Your three answers applied to the grouped-card structure: one card per section, the description behind a <b style={{ font: 'inherit', color: 'inherit' }}>?</b> on each row, and the “last changed by” line kept on every row — including inside the matrix, where each cell carries its own stamp. Flip the switch to compare the import/export sections as rows and as a matrix.</div>
        <div className="exd-switch">
          <span className="exd-switch-lbl">Import/export</span>
          <div className="exd-seg" role="group" aria-label="Import and export layout">
            <button type="button" className={`exd-seg-btn${!matrix ? ' active' : ''}`} aria-pressed={!matrix} onClick={() => setMatrix(false)}>Rows</button>
            <button type="button" className={`exd-seg-btn${matrix ? ' active' : ''}`} aria-pressed={matrix} onClick={() => setMatrix(true)}>Matrix</button>
          </div>
        </div>
      </div>
      <PageHeader
        title="System settings"
        icon="settings"
        sub="Instance-wide configuration for this Odyssey deployment"
        searchDefaultOpen
        search={(
          <div style={{ flex: 1, minWidth: 280 }}>
            <SearchField placeholder="Search settings…" value={q} onChange={setQ} />
          </div>
        )}
        primary={<ExSaveBar d={d} />}
      />
      {groups.length ? (
        <div className="exc-stack">{groups.map(g => <SectionCard key={g.group} g={g} d={d} matrix={matrix} filtered={!!t} />)}</div>
      ) : (
        <div className="ex-empty">Nothing matches “{q.trim()}”.</div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
