<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>System settings · A — Section cards</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<link rel="stylesheet" href="explore.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script src="../ui_kits/web/system-settings-data.js"></script>
<script type="text/babel" src="settings-explore-common.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { MIcon, SearchField } = window.OdysseyDesignSystem_d5aa51;

function SectionCard({ g, d }) {
  const rt = d.rtFor(g);
  const dirty = d.dirtyIn(g);
  const meta = exGroupMeta(g);
  const noteAfter = g.note && g.rows.some(r => r.key === g.note.afterRow) ? g.note.afterRow : null;
  return (
    <section className="gcard" aria-labelledby={`exa-g-${g.group}`}>
      <header className="gcard-h">
        <span className="gcard-ic"><MIcon name={g.icon} size={17} /></span>
        <h2 className="gcard-t" id={`exa-g-${g.group}`}>{g.group}</h2>
        {dirty > 0
          ? <span className="gcard-badge" style={{ marginLeft: 'auto' }}>{dirty} unsaved</span>
          : <span className="gcard-count">{g.rows.length} settings</span>}
      </header>
      {g.note ? (
        <div className="gcard-note" role="note">
          <span className="material-icons" aria-hidden="true">{g.note.icon}</span>
          <div>{g.note.body}</div>
        </div>
      ) : null}
      {rt ? (
        <div className="gcard-alert" id={`ex-rt-${g.group}`} role="alert" tabIndex={-1}>
          <span className="material-icons" aria-hidden="true">error_outline</span>
          <div>{rt}</div>
        </div>
      ) : null}
      <div>
        {g.rows.map(r => (
          <div key={r.key} className={`exa-row${exWide(r) ? ' wide' : ''}`}>
            <div>
              <div className="exa-ttl" id={`ex-ttl-${r.key}`}>
                {r.title}
                {d.dirtyRow(r) ? <span className="ex-dot" title="Unsaved change" aria-hidden="true" /> : null}
                {d.dirtyRow(r) ? <span className="ex-sr"> (unsaved change)</span> : null}
              </div>
              <div className="exa-desc">{r.desc}</div>
            </div>
            <div className="exa-ctrl"><ExControl row={r} d={d} /></div>
          </div>
        ))}
      </div>
      {meta ? (
        <div className="gcard-foot">
          <span className="material-icons" aria-hidden="true">history</span>
          Last changed by <b>{meta.by}</b> on {meta.on}
        </div>
      ) : (
        <div className="gcard-foot">
          <span className="material-icons" aria-hidden="true">history</span>
          Never changed — all defaults
        </div>
      )}
    </section>
  );
}

function App() {
  const d = useExDraft();
  const [q, setQ] = React.useState('');
  const t = q.trim().toLowerCase();
  const groups = SS_GROUPS
    .map(g => ({ ...g, rows: t ? g.rows.filter(r => (r.title + ' ' + r.desc + ' ' + g.group).toLowerCase().includes(t)) : g.rows }))
    .filter(g => g.rows.length);
  return (
    <div className="ex-wrap">
      <div className="ex-banner">
        <b>Direction A</b>
        <div>One card per section. Same row anatomy as today — icon dropped from the row and moved to the section head, the per-row history line collapsed into one card footer, and the section label now lives inside the card instead of floating above a stack of cards. 42 rows, 12 cards.</div>
      </div>
      <header className="ex-head">
        <div className="ex-head-l">
          <span className="ex-head-ic"><MIcon name="settings" size={20} /></span>
          <div>
            <h1>System settings</h1>
            <p>Instance-wide configuration for this Odyssey deployment</p>
          </div>
        </div>
        <div className="ex-head-r">
          <div className="ex-search"><SearchField placeholder="Search settings…" value={q} onChange={setQ} /></div>
          <ExSaveBar d={d} />
        </div>
      </header>
      {groups.length ? (
        <div className="exa-stack">{groups.map(g => <SectionCard key={g.group} g={g} d={d} />)}</div>
      ) : (
        <div className="ex-empty">Nothing matches “{q.trim()}”.</div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
