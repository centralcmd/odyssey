<!doctype html>
<!-- @dsCard group="Components" name="Components · BreakdownTile (.odc-breakdown)" subtitle="Labelled icon·label·count distribution tile — the generic 'By type' / 'By status' summary tile" viewport="720x400" -->
<html lang="en" data-theme="dark">
<head>
  <title>Odyssey · Components · BreakdownTile (.odc-breakdown)</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    html, body { margin: 0; background: var(--mud-palette-background); }
    body { font-family: var(--font-sans); color: var(--mud-palette-text-primary); padding: 28px 30px; }
    .cap {
      font: var(--fw-medium) var(--fs-overline)/1 var(--font-sans);
      letter-spacing: var(--tracking-caps); text-transform: uppercase;
      color: var(--mud-palette-text-secondary); margin-bottom: 12px;
    }
    .cap code { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; color: var(--brand-text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  </style>
</head>
<body>
  <div class="cap">BreakdownTile <code>&lt;BreakdownTile label rows /&gt;</code> — two instances, one data shape</div>
  <div class="grid">

    <!-- By type -->
    <div class="odc-breakdown">
      <span class="odc-breakdown-ov">By type</span>
      <div class="odc-breakdown-rows">
        <div class="odc-breakdown-row"><span class="material-icons" style="color:oklch(0.72 0.16 295)">work</span><span class="odc-breakdown-label">Employment</span><span class="odc-breakdown-n">1</span></div>
        <div class="odc-breakdown-row"><span class="material-icons" style="color:oklch(0.79 0.115 188)">home_repair_service</span><span class="odc-breakdown-label">Service</span><span class="odc-breakdown-n">2</span></div>
        <div class="odc-breakdown-row"><span class="material-icons" style="color:oklch(0.75 0.16 330)">cottage</span><span class="odc-breakdown-label">Tenancy</span><span class="odc-breakdown-n">1</span></div>
      </div>
    </div>

    <!-- By status -->
    <div class="odc-breakdown">
      <span class="odc-breakdown-ov">By status</span>
      <div class="odc-breakdown-rows">
        <div class="odc-breakdown-row"><span class="material-icons" style="color:var(--finance-income)">task_alt</span><span class="odc-breakdown-label">Active</span><span class="odc-breakdown-n">3</span></div>
        <div class="odc-breakdown-row"><span class="material-icons" style="color:var(--sea-400)">schedule</span><span class="odc-breakdown-label">Upcoming</span><span class="odc-breakdown-n">1</span></div>
        <div class="odc-breakdown-row"><span class="material-icons" style="color:var(--finance-expense)">event_busy</span><span class="odc-breakdown-label">Expired</span><span class="odc-breakdown-n">0</span></div>
        <div class="odc-breakdown-row"><span class="material-icons" style="color:var(--mud-palette-text-secondary)">inventory_2</span><span class="odc-breakdown-label">Archived</span><span class="odc-breakdown-n">2</span></div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="odc-breakdown">
      <span class="odc-breakdown-ov">By currency</span>
      <div class="odc-breakdown-empty">No contracts on file.</div>
    </div>

  </div>
</body>
</html>
