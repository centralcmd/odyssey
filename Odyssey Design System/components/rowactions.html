<!doctype html>
<!-- @dsCard group="Components" name="RowActions" subtitle="The end-of-row icon cluster for tables and list items — hidden until the row is hovered or focused, always visible on touch. Replaces the per-surface .trm-rowbtns / .est-rowbtns / .ua-row-actions copies." viewport="900x460" -->
<html lang="en" data-theme="dark">
<head>
<title>Odyssey · RowActions</title>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<style>
html,body{margin:0;background:var(--mud-palette-background)}
body{font-family:var(--font-sans);color:var(--mud-palette-text-primary);padding:26px 30px}
h1{font:var(--fw-bold) var(--fs-h6)/1 var(--font-sans);margin:0 0 6px}
.hint{font:var(--fw-regular) var(--fs-caption)/1.5 var(--font-sans);color:var(--mud-palette-text-secondary);margin:0 0 20px}
.lbl{font:var(--fw-medium) var(--fs-overline)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mud-palette-text-secondary);margin:22px 0 8px}
table{width:100%;border-collapse:collapse;max-width:760px}
th{text-align:left;font:var(--fw-medium) var(--fs-overline)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mud-palette-text-secondary);padding:0 10px 8px}
td{padding:9px 10px;border-top:1px solid var(--mud-palette-divider);font:var(--fw-regular) var(--fs-body2)/1.3 var(--font-sans)}
tr:hover td{background:var(--mud-palette-action-default-hover)}
td.act{text-align:right;width:1%}
.host{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;padding:11px 13px;border:1px solid var(--mud-palette-divider);border-radius:var(--radius-md);background:var(--mud-palette-surface)}
.mono{font-family:var(--font-mono);color:var(--brand-text)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<h1>RowActions</h1>
<p class="hint">Hover a row to reveal its actions. Keyboard users get them on <span class="mono">:focus-within</span>; touch devices always see them.</p>
<div id="root"></div>
<script>
(function(){
  var e = React.createElement;
  var NS = window.OdysseyDesignSystem_d5aa51 || {};
  var RowActions = NS.RowActions;
  var noop = function(){};
  var pair = [
    { icon:'edit', label:'Edit row', onClick:noop },
    { icon:'delete', label:'Delete row', danger:true, onClick:noop }
  ];
  var rows = [['1 Feb 2026','kr 412 000'],['1 Nov 2025','kr 398 500'],['1 Aug 2025','kr 377 200']];

  ReactDOM.createRoot(document.getElementById('root')).render(
    e(React.Fragment, null,
      e('div',{className:'lbl'},'In a table row — reveal on hover'),
      e('table', null,
        e('thead', null, e('tr', null,
          e('th',{scope:'col'},'Effective from'), e('th',{scope:'col'},'Value'), e('th',{scope:'col','aria-label':'Actions'}))),
        e('tbody', null, rows.map(function(r,i){
          return e('tr',{key:i},
            e('td',null,r[0]), e('td',{className:'mono'},r[1]),
            e('td',{className:'act'}, e(RowActions,{actions:pair})));
        }))
      ),
      e('div',{className:'lbl'},'On a non-table row — add odc-rowactions-host'),
      e('div',{className:'host odc-rowactions-host'},
        e('span',null,'Nordea · Savings'),
        e(RowActions,{actions:[
          { icon:'open_in_new', label:'Open account', onClick:noop },
          { icon:'link_off', label:'Detach account', danger:true, onClick:noop }
        ]})
      ),
      e('div',{className:'lbl'},'Pinned visible — reveal={false}'),
      e('div',{className:'host'},
        e('span',null,'Always-actionable row'),
        e(RowActions,{reveal:false,size:'md',actions:[
          { icon:'content_copy', label:'Duplicate', onClick:noop },
          { icon:'archive', label:'Archive', onClick:noop },
          { icon:'delete', label:'Delete', danger:true, onClick:noop }
        ]})
      )
    )
  );
})();
</script>
</body>
</html>
