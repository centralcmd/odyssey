<!doctype html>
<!-- @dsCard group="Components" name="ContactSelect" subtitle="The contact picker — a Combobox over the contact vocabulary with per-type glyphs and typed inline create rows (Organization, then Person). Used by every field that links a record to a contact." viewport="900x560" -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>ContactSelect</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--mud-palette-background);color:var(--mud-palette-text-primary);font-family:var(--font-sans);padding:36px 40px}
.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;max-width:820px}
.note{grid-column:1/-1;margin:0 0 4px;font:400 13px/1.6 var(--font-sans);color:var(--mud-palette-text-secondary);max-width:70ch}
.note b{color:var(--mud-palette-text-primary);font-weight:500}
</style>
</head>
<body>
<div id="root"></div>
<script>
const NS = window.OdysseyDesignSystem_d5aa51 || {};
const { ContactSelect } = NS;
const CONTACTS = [
  { id: 'c1', name: 'Whole Foods Market', type: 'Merchant' },
  { id: 'c2', name: 'Lakeside Property Management LLC', type: 'Organization' },
  { id: 'c3', name: 'Michael Chen', type: 'Person' },
  { id: 'c4', name: 'JPMorgan Chase', type: 'Institution' },
  { id: 'c5', name: 'FitZone Gym', type: 'Merchant', archived: '2025-03-02T09:00:00Z' },
];
function Demo() {
  const [a, setA] = React.useState('c3');
  const [b, setB] = React.useState('');
  const [made, setMade] = React.useState(null);
  if (!ContactSelect) return React.createElement('div', null, 'Bundle not compiled yet.');
  return React.createElement('div', { className: 'wrap' },
    React.createElement('p', { className: 'note' },
      React.createElement('b', null, 'One picker for every contact field.'),
      ' Options are the active contacts, each with its ContactType glyph in the registry colour; the archived FitZone Gym is filtered out. With ',
      React.createElement('b', null, 'allowCreate'),
      ' the popover offers one create row per type, so a contact created inline carries a real type instead of a guessed one.'),
    React.createElement(ContactSelect, {
      label: 'Contact', optional: true, value: a, onChange: setA, contacts: CONTACTS,
      help: 'Read-only vocabulary — no inline create.',
    }),
    React.createElement(ContactSelect, {
      label: 'Merchant', optional: true, value: b, contacts: CONTACTS,
      allowCreate: true, createLabel: 'Add',
      onChange: setB,
      onCreate: (name, kind) => { setMade(name + ' · ' + kind); return { value: 'new-1', label: name }; },
      help: made ? 'Created: ' + made : 'Type a name that matches nothing to see both create rows.',
    }),
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo));
</script>
</body>
</html>
