<!doctype html>
<!-- @dsCard group="Components" name="Components · DateRangePicker" subtitle="Two DatePickers as one inline filter-bar pill — icon + caption, from/to joined by a dash, ordered range + clear. Live render off the DS namespace." viewport="720x460" -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Odyssey · DateRangePicker</title>
  <link rel="stylesheet" href="../colors_and_type.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>

  <style>
    html, body { margin: 0; background: var(--mud-palette-background); }
    body { font-family: var(--font-sans); color: var(--mud-palette-text-primary); padding: 28px 30px; }
    .stack { display: flex; flex-direction: column; gap: 26px; align-items: flex-start; }
    .block { display: flex; flex-direction: column; gap: 12px; }
    .cap { font: var(--fw-medium) var(--fs-overline)/1 var(--font-sans); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--mud-palette-text-secondary); }
    .cap code { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; color: var(--brand-text); }
    .readout { font: var(--fw-regular) var(--fs-caption)/1 var(--font-mono); color: var(--mud-palette-text-secondary); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { DateRangePicker } = window.OdysseyDesignSystem_d5aa51;
    const fmt = (r) => `{ from: ${r.from ? '"' + r.from + '"' : 'null'}, to: ${r.to ? '"' + r.to + '"' : 'null'} }`;

    function Demo() {
      const [taken, setTaken] = React.useState({ from: '2026-05-01', to: '2026-06-30' });
      const [due, setDue] = React.useState({ from: null, to: null });
      return (
        <div className="stack">
          <div className="block">
            <div className="cap">With caption &amp; value <code>&lt;DateRangePicker label="Taken" value onChange /&gt;</code></div>
            <DateRangePicker label="Taken" value={taken} onChange={setTaken} />
            <div className="readout">{fmt(taken)}</div>
          </div>
          <div className="block">
            <div className="cap">Empty, no caption <code>&lt;DateRangePicker icon="event" value onChange /&gt;</code></div>
            <DateRangePicker value={due} onChange={setDue} />
            <div className="readout">{fmt(due)}</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
