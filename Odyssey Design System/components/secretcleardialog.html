<!doctype html>
<!-- @dsCard group="Dialogs" name="SecretClearDialog" subtitle="Confirmation in front of clearing a stored secret, in two copy variants. A rotatable credential is recoverable — re-issue it at the provider and paste it back — so the copy names what stops working and the row returning to `not set`. A derivation key has no provider to re-issue it from: the coral callout states that anything already derived with it can never be re-derived. One confirm button, not a typed confirmation; a value that cannot be read back cannot be re-typed to prove intent. A third variant softens the copy when the row being cleared is already unreadable, where clearing breaks nothing currently working." viewport="1020x760" -->
<html lang="en" data-theme="dark">
<head>
<title>Odyssey · SecretClearDialog</title>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</head>
<body>
<h1>SecretClearDialog — <code>&lt;SecretClearDialog label kind affects /&gt;</code></h1>
<div id="root"></div>
<script>
(function () {
  var e = React.createElement, useState = React.useState;
  var NS = window.OdysseyDesignSystem_d5aa51 || {};
  var Dialog = NS.SecretClearDialog, Button = NS.Button;

  var VARIANTS = {
    derivation: {
      pick: 'Derivation key',
      props: {
        label: 'Pseudonymisation secret', secretKey: 'Legal:PseudonymizationSecret', kind: 'derivation',
        affects: 'Account deletion can no longer pseudonymise consent records until a new value is entered.'
      }
    },
    credential: {
      pick: 'Rotatable credential',
      props: {
        label: 'SMTP password', secretKey: 'Email:Password', kind: 'credential',
        affects: 'Transactional mail is sent unauthenticated, and any relay that requires a login will reject it.'
      }
    },
    unreadable: {
      pick: 'Already unreadable',
      props: {
        label: 'File analysis API key', secretKey: 'FileAnalysis:ApiKey', kind: 'credential', unreadable: true
      }
    }
  };

  function Demo() {
    var v = useState('derivation');
    var cur = VARIANTS[v[0]];
    return e(React.Fragment, null,
      e('div', { className: 'cap' }, 'Three variants'),
      e('p', { className: 'note' },
        'The two kinds carry different losses, so they cannot share one wording: a credential can be ' +
        're-issued at its provider, a derivation key cannot exist twice. The irreversible clause is a ' +
        'coral callout rather than the amber advisory band used elsewhere on the settings page \u2014 an ' +
        'advisory is about cost, and this is the loss itself.'),
      e('div', { className: 'picks' }, Object.keys(VARIANTS).map(function (k) {
        return e(Button, { key: k, variant: v[0] === k ? 'filled' : 'outlined', onClick: function () { v[1](k); } },
          VARIANTS[k].pick);
      })),
      e(Dialog, Object.assign({}, cur.props, {
        open: true,
        onCancel: function () {},
        onConfirm: function () {}
      })));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
})();
</script>
