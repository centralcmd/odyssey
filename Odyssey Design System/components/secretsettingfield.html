<!doctype html>
<!-- @dsCard group="Components" name="SecretSettingField" subtitle="One encrypted, write-only credential in the SettingField shape. The store's three results each get their own treatment: a fixed-length dot mask for `found` (the real length is itself a disclosure), an inline entry input for `not-set` with an amber advisory naming what is not working meanwhile, and a coral `Cannot be decrypted` for `unreadable` — which must never read as merely unset. Replacing a stored value takes an explicit Replace first; entry is a password input with a reveal toggle and an as-you-type printable-ASCII check. A `Derivation key` marker sits in the outline where a value's loss cannot be undone by re-issuing it." viewport="1020x1800" -->
<html lang="en" data-theme="dark">
<head>
<title>Odyssey · SecretSettingField</title>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>
html,body{margin:0;background:var(--mud-palette-background)}
body{font-family:var(--font-sans);color:var(--mud-palette-text-primary);padding:30px 32px}
.stack{display:flex;flex-direction:column;gap:30px;max-width:920px}
.cap{font:var(--fw-medium) var(--fs-overline)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mud-palette-text-secondary);margin-bottom:12px}
.note{font:var(--fw-regular) var(--fs-caption)/1.6 var(--font-sans);color:var(--mud-palette-text-secondary);max-width:78ch;margin:0 0 14px;text-wrap:pretty}
h1{font:var(--fw-bold) var(--fs-h6)/1 var(--font-sans);margin:0 0 22px}
code{font-family:var(--font-mono);font-size:.8em;color:var(--brand-text)}
a{color:var(--brand-text)}a:hover{color:var(--mud-palette-primary)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<h1>SecretSettingField — <code>&lt;SecretSettingField label state kind help meta /&gt;</code></h1>
<div id="root" class="stack"></div>
<script>
(function () {
  var e = React.createElement;
  var NS = window.OdysseyDesignSystem_d5aa51 || {};
  var F = NS.SecretSettingField;

  function group(key, cap, note, kids) {
    return e('div', { key: key },
      e('div', { className: 'cap' }, cap),
      note ? e('p', { className: 'note' }, note) : null,
      e('div', { className: 'odc-sfield-grid' }, kids));
  }

  var body = [
    group('found', 'Found — the value is stored',
      'The mask is a fixed sixteen bullets whatever the value is; a mask that tracked the real length would leak it. Screen readers get "Value stored, hidden" instead of a run of bullets. Replace swaps the mask for an entry input; the stored value stays in force until Save.',
      [
        e(F, { key: 1, label: 'File analysis API key', secretKey: 'FileAnalysis:ApiKey', state: 'found',
          help: 'Sent as x-api-key on every analysis request. A rotation takes effect on the next request, without a restart.',
          meta: 'Set by Priya Anand, 18 Aug 2026, 08:41.' }),
      ]),

    group('notset', 'Not set — nothing to protect, something to do',
      'The only state that renders its input immediately: there is no stored value to overwrite by accident, and typing is the expected next action. The advisory names what is not working meanwhile — after an upgrade every one of these rows starts here, and a release note is not a signal an administrator receives at the moment it matters.',
      [
        e(F, { key: 1, label: 'SMTP password', secretKey: 'Email:Password', state: 'not-set',
          help: 'Authenticates the relay connection. A human-chosen password at a third-party provider.',
          meta: 'Never set.',
          consequence: 'Transactional mail — password resets, email confirmations — is sent unauthenticated and will be rejected by any relay that requires a login. Enter the value to restore sending.' }),
        e(F, { key: 2, label: 'Recipient hash key', secretKey: 'Email:RecipientHashKey', state: 'not-set',
          kind: 'derivation',
          help: 'Derives the digests the send throttle counts per recipient.',
          meta: 'Never set.',
          consequence: 'Unset is a supported configuration, not a fault: a random key is generated per process, so throttle digests correlate within one process\u2019s lifetime and not across a restart.' }),
      ]),

    group('unreadable', 'Unreadable — present, and failing right now',
      'The state the encrypted store exists to make legible rather than silent. The value is in the database but this instance\u2019s key ring cannot open it, so the consumer is failing closed. It shares no colour, glyph or wording with "not set", because an absent row is a healthy configuration and this is an outage. The affected feature is named in the copy: nothing about the key\u2019s name tells an administrator what stopped.',
      [
        e(F, { key: 1, label: 'SMTP password', secretKey: 'Email:Password', state: 'unreadable',
          help: 'Authenticates the relay connection.',
          meta: 'Set by Marcus Reyes, 2 Aug 2026, 09:10.',
          affects: 'Transactional mail is not sending — every send is logged and skipped.' }),
        e(F, { key: 2, label: 'Pseudonymisation secret', secretKey: 'Legal:PseudonymizationSecret',
          state: 'unreadable', kind: 'derivation',
          help: 'HMACs the subject of a consent record when an account is deleted.',
          meta: 'Set by Priya Anand, 4 Jul 2026, 12:02.',
          affects: 'Account deletion cannot pseudonymise consent rows.' }),
      ]),

    group('entry', 'Entry — the one moment the value is legible',
      'A password input with a reveal toggle. Revealing is not a concession: a mistyped key fails silently and can never be read back to check, so it has to be checkable while it is being typed. The printable-ASCII rule is checked as you type and named in the error rather than left to the store\u2019s 400 — the constraint is arbitrary from the administrator\u2019s side, and a human-chosen relay password may legitimately fall outside it. Enter saves, Esc cancels a replacement.',
      [
        e(F, { key: 1, label: 'SMTP password', secretKey: 'Email:Password', state: 'not-set',
          help: 'Type a non-ASCII character to see the pre-flight check.', meta: 'Never set.' }),
        e(F, { key: 2, label: 'SMTP password (relaxation taken)', secretKey: 'Email:Password',
          state: 'not-set', allowNonAscii: true,
          help: 'allowNonAscii — the descriptor has declared the relaxation, so the client check is dropped and the store\u2019s rule stands alone.',
          meta: 'Never set.' }),
      ]),

    group('locked', 'Locked — no claim',
      'Entry and both actions are withdrawn, and the reason is appended to the helper line rather than shown as an error: the row is not wrong, it is not this caller\u2019s to change.',
      [
        e(F, { key: 1, label: 'File analysis API key', secretKey: 'FileAnalysis:ApiKey', state: 'found',
          locked: true,
          help: 'Sent as x-api-key on every analysis request.',
          meta: 'Set by Priya Anand, 18 Aug 2026, 08:41.' }),
      ]),
  ];

  ReactDOM.createRoot(document.getElementById('root')).render(e(React.Fragment, null, body));
})();
</script>
</body>
</html>
