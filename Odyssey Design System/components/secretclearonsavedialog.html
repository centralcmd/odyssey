<!doctype html>
<!-- @dsCard group="Dialogs" name="SecretClearOnSaveDialog" subtitle="The gate in front of a page SAVE that clears a stored secret as a side effect of changing something else — a new SMTP host, or STARTTLS switched off. Two copy variants, one per trigger: a credential must never be presented to a relay it was not entered for, and must never be replayed over a cleartext transport. Because it gates the settings page's whole-page batch save rather than a single field, the copy carries what no other dialog can: the clear and the change commit in one transaction, Confirm submits every pending edit, and Cancel discards none of them." viewport="1020x800" -->
<html lang="en" data-theme="dark">
<head>
<title>Odyssey · SecretClearOnSaveDialog</title>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>
html,body{margin:0;background:var(--mud-palette-background)}
body{font-family:var(--font-sans);color:var(--mud-palette-text-primary);padding:30px 32px}
h1{font:var(--fw-bold) var(--fs-h6)/1 var(--font-sans);margin:0 0 20px}
.cap{font:var(--fw-medium) var(--fs-overline)/1 var(--font-sans);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--mud-palette-text-secondary);margin-bottom:12px}
.note{font:var(--fw-regular) var(--fs-caption)/1.6 var(--font-sans);color:var(--mud-palette-text-secondary);max-width:80ch;margin:0 0 16px;text-wrap:pretty}
.picks{display:flex;gap:10px;flex-wrap:wrap}
code{font-family:var(--font-mono);font-size:.8em;color:var(--brand-text)}
a{color:var(--brand-text)}a:hover{color:var(--mud-palette-primary)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head>
<body>
<h1>SecretClearOnSaveDialog — <code>&lt;SecretClearOnSaveDialog reason fromHost toHost secrets /&gt;</code></h1>
<div id="root"></div>
<script>
(function () {
  var e = React.createElement, useState = React.useState;
  var NS = window.OdysseyDesignSystem_d5aa51 || {};
  var Dialog = NS.SecretClearOnSaveDialog, Button = NS.Button;
  var SECRETS = ['SMTP username', 'SMTP password'];

  var VARIANTS = {
    host: {
      pick: 'SMTP host changed',
      props: { reason: 'host', fromHost: 'smtp.example.net', toHost: 'smtp.newprovider.net', secrets: SECRETS, pendingCount: 3 }
    },
    starttls: {
      pick: 'STARTTLS turned off',
      props: { reason: 'starttls', fromHost: 'smtp.example.net', secrets: SECRETS, pendingCount: 1 }
    }
  };

  function Demo() {
    var v = useState('host');
    var cur = VARIANTS[v[0]];
    return e(React.Fragment, null,
      e('div', { className: 'cap' }, 'Two triggers'),
      e('p', { className: 'note' },
        'Both are destructive to a stored credential, and neither is the action the administrator ' +
        'set out to take \u2014 so the dialog names the change, the consequence and the recovery in that ' +
        'order. The confirm button counts the pending edits it is about to submit, because this is ' +
        'the page\u2019s single batch Save and not a per-field one.'),
      e('div', { className: 'picks' }, Object.keys(VARIANTS).map(function (k) {
        return e(Button, { key: k, variant: v[0] === k ? 'filled' : 'outlined', onClick: function () { v[1](k); } },
          VARIANTS[k].pick);
      })),
      e(Dialog, Object.assign({}, cur.props, {
        open: true,
        onCancel: function () {},
        onConfirm: function () {}
      })));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Demo));
})();
</script>
</body>
</html>
