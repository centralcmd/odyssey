<!doctype html>
<!-- @dsCard group="Dialogs" name="New alias" subtitle="ContactAliases' add / edit dialog — a required Alias value (≤128) and an optional free-text Label (≤64). Opened from the contact card's ⋯ menu; a duplicate, a cap breach or a validation failure keeps it open with the message inline on the value field and no toast. Live." viewport="760x620" -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Odyssey · New alias dialog</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="../ui_kits/web/kit.css" />
  <link rel="stylesheet" href="../ui_kits/web/account.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>

  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--mud-palette-background); font-family: var(--font-sans); color: var(--mud-palette-text-primary); }
    .specimen-bg { position: fixed; inset: 0; padding: 34px 44px; opacity: 0.5; pointer-events: none; overflow: hidden; }
    .specimen-bg h1 { font: 300 30px/1 var(--font-sans); letter-spacing: -0.02em; color: var(--ink-50); margin: 0 0 6px; }
    .specimen-bg p { font: 400 13px/1 var(--font-sans); color: var(--mud-palette-text-secondary); margin: 0 0 22px; }
    .odc-scrim { animation: none !important; }
    .odc-modal { animation: none !important; opacity: 1 !important; transform: none !important; }
    .stage { position: fixed; inset: 0; padding: 34px 44px; }
  </style>
</head>
<body>
  <div class="specimen-bg">
    <h1>Karoline Hansen</h1>
    <p>Person · Aliases 3</p>
  </div>
  <div class="stage"><div id="root"></div></div>

  <script type="text/babel" data-presets="env,react">
    const NS = window.OdysseyDesignSystem_d5aa51 || {};
    const { ContactAliases } = NS;

    /* The dialog is opened the way the product opens it: the record card's ⋯
       menu posts an add request, which this component consumes. */
    function Demo() {
      if (!ContactAliases) return <p>The compiled bundle does not carry <code>ContactAliases</code> yet.</p>;
      return (
        <ContactAliases
          aliases={[{ id: 'a1', value: 'Kari', label: 'nickname' }, { id: 'a2', value: 'Kari Menon', label: 'maiden name' }, { id: 'a3', value: 'K. Hansen', label: null }]}
          canCreate canUpdate canDelete
          addRequest={{ nonce: 1 }}
          onAdd={() => {}} onEdit={() => {}} onDelete={() => {}} />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
