<!doctype html>
<!-- @dsCard group="Dialogs" name="New term" subtitle="AddTermModal — create / edit an account rate or fee: eligibility-gated kind, percentage-or-amount value, currency, effective date, billing period, note. Live." viewport="760x900" -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Odyssey · New term dialog</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="../ui_kits/web/kit.css" />
  <link rel="stylesheet" href="../ui_kits/web/account-terms.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../_ds_bundle.js"></script>
  <script src="../ui_kits/web/data.js"></script>

  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--mud-palette-background); font-family: var(--font-sans); color: var(--mud-palette-text-primary); }
    .specimen-bg { position: fixed; inset: 0; padding: 40px 56px; opacity: 0.5; pointer-events: none; overflow: hidden; }
    .specimen-bg h1 { font: 300 32px/1 var(--font-sans); letter-spacing: -0.02em; color: var(--ink-50); margin: 0 0 6px; }
    .specimen-bg p  { font: 400 13px/1 var(--font-sans); color: var(--mud-palette-text-secondary); margin: 0 0 24px; }
    .specimen-bg .bar { height: 46px; border-radius: 8px; background: var(--mud-palette-surface); border: 1px solid var(--mud-palette-divider); margin-bottom: 10px; }
    /* Freeze the entrance animation so the card thumbnail captures the end state. */
    .odc-scrim { animation: none !important; }
    .odc-modal { animation: none !important; opacity: 1 !important; transform: none !important; }
  </style>
</head>
<body>
  <div class="specimen-bg">
    <h1>Accounts</h1>
    <p>5 active · combined $ 69,549</p>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div id="root"></div>

  <script type="text/babel" src="../ui_kits/web/Components.jsx"></script>
  <script type="text/babel" src="../ui_kits/web/AddTermModal.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const D = window.OdysseyData;
    // AddTermModal reads ACCOUNT_TYPE_LABEL (normally set by Accounts.jsx) for its
    // eligibility note; seed it from the registry so this standalone card matches.
    window.ACCOUNT_TYPE_LABEL = Object.fromEntries(D.accountTypes.map(t => [t.key, t.label]));

    const AddTermModal = window.AddTermModal;
    // Amex Platinum (CreditCard): interest rate + the four fees are eligible,
    // expected return is not — so the dialog shows its eligibility note.
    const account = D.accountById['3'];
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AddTermModal account={account} onClose={() => {}} onSave={() => {}} />
    );
  </script>
</body>
</html>
