<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Odyssey · New tag dialog</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="../ui_kits/web/kit.css" />
  <link rel="stylesheet" href="../ui_kits/web/account.css" />
  <link rel="stylesheet" href="../ui_kits/web/admin.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../_ds_bundle.js"></script>
  <script src="../ui_kits/web/data.js"></script>

  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--mud-palette-background); font-family: var(--font-sans); color: var(--mud-palette-text-primary); }
    .specimen-bg { position: fixed; inset: 0; padding: 40px 56px; opacity: 0.5; pointer-events: none; overflow: hidden; }
    .specimen-bg h1 { font: 300 32px/1 var(--font-sans); letter-spacing: -0.02em; color: var(--ink-50); margin: 0 0 6px; }
    .specimen-bg p  { font: 400 13px/1 var(--font-sans); color: var(--mud-palette-text-secondary); margin: 0 0 24px; }
    .specimen-bg .bar { height: 46px; border-radius: 8px; background: var(--mud-palette-surface); border: 1px solid var(--mud-palette-divider); margin-bottom: 10px; }
    /* Freeze the entrance animation so the card thumbnail captures the end state. */
    .aam-scrim, .odc-scrim  { animation: none !important; }
    .aam-dialog, .odc-modal { animation: none !important; opacity: 1 !important; transform: none !important; }
    /* State switcher (sits above the dialog scrim) */
    .switcher { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; gap: 4px; padding: 5px; background: var(--mud-palette-surface); border: 1px solid var(--mud-palette-divider); border-radius: 999px; box-shadow: var(--mud-elevation-8); }
    .switcher button { border: none; background: transparent; cursor: pointer; font: 500 12px/1 var(--font-sans); letter-spacing: 0.02em; color: var(--mud-palette-text-secondary); padding: 8px 13px; border-radius: 999px; }
    .switcher button:hover { background: var(--mud-palette-action-default-hover); color: var(--mud-palette-text-primary); }
    .switcher button.on { background: var(--mud-palette-primary); color: var(--ink-950); }
  </style>
</head>
<body>
  <div class="specimen-bg">
    <h1>Tags</h1>
    <p>14 transaction tags</p>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div id="root"></div>
  <script type="text/babel" src="../ui_kits/web/Components.jsx"></script>
  <script type="text/babel" src="../ui_kits/web/TransactionTags.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const AddTagModal = window.AddTagModal;
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AddTagModal onClose={() => {}} onCreate={() => {}} />
    );
  </script>
</body>
</html>
