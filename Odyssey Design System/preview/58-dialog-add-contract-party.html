<!doctype html>
<!-- @dsCard group="Dialogs" name="New contract party" subtitle="AddContractPartyModal — the accessible two-step party picker: choose a kind (Account / Contact), then pick the record from a pre-loaded Combobox. Already-linked records are filtered out. Live." viewport="760x620" -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Odyssey · New contract party dialog</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="../ui_kits/web/kit.css" />
  <link rel="stylesheet" href="../ui_kits/web/insurance.css" />
  <link rel="stylesheet" href="../ui_kits/web/contracts.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../_ds_bundle.js"></script>
  <script src="../ui_kits/web/data.js"></script>
  <script src="../ui_kits/web/insurance-data.js"></script>
  <script src="../ui_kits/web/contracts-data.js"></script>

  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--mud-palette-background); font-family: var(--font-sans); color: var(--mud-palette-text-primary); }
    .specimen-bg { position: fixed; inset: 0; padding: 40px 56px; opacity: 0.5; pointer-events: none; overflow: hidden; }
    .specimen-bg h1 { font: 300 32px/1 var(--font-sans); letter-spacing: -0.02em; color: var(--ink-50); margin: 0 0 6px; }
    .specimen-bg p  { font: 400 13px/1 var(--font-sans); color: var(--mud-palette-text-secondary); margin: 0 0 24px; }
    .specimen-bg .bar { height: 46px; border-radius: 8px; background: var(--mud-palette-surface); border: 1px solid var(--mud-palette-divider); margin-bottom: 10px; }
    .aam-scrim, .odc-scrim  { animation: none !important; }
    .aam-dialog, .odc-modal { animation: none !important; opacity: 1 !important; transform: none !important; }
  </style>
</head>
<body>
  <div class="specimen-bg">
    <h1>Maple St Residence — Lease</h1>
    <p>Rental · parties</p>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
  <div id="root"></div>

  <script type="text/babel" src="../ui_kits/web/Components.jsx"></script>
  <script type="text/babel" src="../ui_kits/web/AddContractPartyModal.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const AddContractPartyModal = window.AddContractPartyModal;
    const D = window.OdysseyData;
    const contract = (D.contracts || []).find(c => c.id === 'ct-lease') || (D.contracts || [])[0] || { parties: [] };
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AddContractPartyModal contract={contract} onClose={() => {}} onAdd={() => {}} />
    );
  </script>
</body>
</html>
