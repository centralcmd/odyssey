<!doctype html>
<!-- @dsCard group="Type" name="Type · Display + headings" subtitle="Display, H1, H2, H3" viewport="700x290" -->
<html lang="en" data-theme="dark"><head>
  <title>Odyssey · Type · Display + headings</title><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <style>
    .row { display: grid; grid-template-columns: 80px 1fr 110px; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--mud-palette-divider-light); }
    .row:last-child { border-bottom: none; }
    .lab { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mud-palette-text-secondary); }
    .meta-r { font: 400 11px/1 var(--font-mono); color: var(--mud-palette-text-secondary); text-align: right; }
  </style>
  <div class="row">
    <div class="lab">Display</div>
    <div class="ods-display">From Earth to Mars</div>
    <div class="meta-r">56 / 300</div>
  </div>
  <div class="row">
    <div class="lab">H1</div>
    <div class="ods-h1">Dashboard</div>
    <div class="meta-r">40 / 300</div>
  </div>
  <div class="row">
    <div class="lab">H2</div>
    <div class="ods-h2">Monthly summary</div>
    <div class="meta-r">32 / 300</div>
  </div>
  <div class="row">
    <div class="lab">H3</div>
    <div class="ods-h3">Recent transactions</div>
    <div class="meta-r">24 / 400</div>
  </div>
</body></html>
