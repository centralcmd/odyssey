<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Tax Statements page" description="Per-year tax records with declared-vs-derived reconciliation, a cross-year settlement flow, a review workflow, tag derivation and document storage." -->
<helmet>
  <script src="../kit-app.js"></script>
</helmet>
<div data-theme="dark" style="min-height: 100vh; background: var(--mud-palette-background, #14161c); color: var(--mud-palette-text-primary, #e7ebf3); padding: 28px 28px 64px; box-sizing: border-box;">
  <div id="kit-mount" style="max-width: 1180px; margin: 0 auto;"></div>
  <div id="kit-loading" style="display: block; max-width: 1180px; margin: 0 auto; padding: 72px 0; text-align: center; font: 400 14px/1.5 var(--font-sans, system-ui); color: var(--mud-palette-text-secondary, #9aa3b2);">
    Loading the Tax Statements page…
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;reportLayout&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;table&quot;, &quot;tiles&quot;], &quot;default&quot;: &quot;table&quot;, &quot;tsType&quot;: &quot;'table' | 'tiles'&quot; }}">
class Component extends DCLogic {
  // Mounts the kit's existing React page (loaded by ../kit-app.js) into a plain
  // container, using the DC runtime's React. See templates/kit-app.js.
  get COMPONENT() { return 'TaxStatements'; }

  _props() {
    const base = window.__KIT_PROPS || {};
    const tweaks = Object.assign({}, base.tweaks, {
      reportLayout: this.props.reportLayout || 'table',
    });
    return Object.assign({}, base, { tweaks: tweaks });
  }

  _mountWhenReady() {
    if (this._mounted) { this._renderApp(); return; }
    if (!this._el) this._el = document.getElementById('kit-mount');
    const ready = this._el && window.React && window.ReactDOM &&
                  window.ReactDOM.createRoot && window.__kitReady && window[this.COMPONENT];
    if (!ready) { this._raf = setTimeout(() => this._mountWhenReady(), 80); return; }
    this._root = window.ReactDOM.createRoot(this._el);
    this._mounted = true;
    const loader = document.getElementById('kit-loading');
    if (loader) loader.style.display = 'none';
    this._renderApp();
  }

  _renderApp() {
    const C = window[this.COMPONENT];
    if (!this._root || !C) return;
    this._root.render(window.React.createElement(C, this._props()));
  }

  componentDidMount() { this._mountWhenReady(); }
  componentDidUpdate() { this._renderApp(); }
  componentWillUnmount() {
    if (this._raf) clearTimeout(this._raf);
    if (this._root) { try { this._root.unmount(); } catch (e) {} }
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
