# ─────────────────────────────────────────────────────────────────────────────
#  DEVELOPMENT STACK — NOT SAFE TO EXPOSE TO A NETWORK
#
#  This file is tuned for a laptop, and its defaults say so: weak fallback database
#  passwords, ASPNETCORE_ENVIRONMENT=Development, Swagger on, demo data seeded, and
#  MariaDB published on port 3307. Every published port binds 127.0.0.1 only, so none of
#  that is reachable from the network — do not remove those prefixes to "test from another
#  machine". The demo accounts share a password published in this repository's README.
#
#  To deploy for real, layer the production overlay on top — it resets the published
#  ports, pins Production, turns Swagger off and disables demo seeding:
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#      --env-file .env.prod up -d
#
#  See docs/deployment.md, and copy .env.prod.example rather than .env.example.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mariadb:
    image: mariadb:11.4
    container_name: odyssey-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-odyssey}
      MARIADB_USER: ${MARIADB_USER:-odyssey}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-odyssey_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      # Loopback-only (issue #451 §1.2). Compose short syntax binds 0.0.0.0, which put this stack's
      # weak fallback password, Development environment and seeded demo accounts on every interface
      # the host has. Prefixing 127.0.0.1 keeps `localhost:3307` working for host tools while making
      # SECURITY.md's "weak dev defaults are out of scope" structurally true rather than declared.
      # The prod overlay resets this list entirely, so it is unaffected.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: Odyssey.MigrationService/Dockerfile
    container_name: odyssey-migrations
    restart: "no"
    # Long enough for an in-flight migration to finish (issue #468). MariaDB commits DDL implicitly,
    # so a migration killed part-way leaves its tables behind with no __EFMigrationsHistory row and
    # every later deploy then fails on it. The job raises HostOptions.ShutdownTimeout to 5 minutes for
    # exactly that reason, but Compose's own 10-second default would SIGKILL the container long before
    # the .NET host got to honour it — the two have to agree or the mitigation is inert.
    stop_grace_period: 5m
    command: sh -c "sleep 10 && dotnet Odyssey.MigrationService.dll"
    environment:
      # This host is Host.CreateApplicationBuilder, which reads DOTNET_ENVIRONMENT and IGNORES
      # ASPNETCORE_ENVIRONMENT entirely, defaulting to Production. Setting only the ASPNETCORE name
      # left the migrations job running as Production in the dev stack, which silently disabled demo
      # seeding (DemoDataSeeder seeds only in Development/Testing, whatever Seed__DemoData says). Both names
      # are set so the job agrees with the API either way; ASPNETCORE_ENVIRONMENT is kept because the
      # image is documented by it and operators set it.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      UseInMemoryDatabase: ${USE_IN_MEMORY_DATABASE:-false}
      # Seed the deterministic demo dataset (Development/Testing only). Default on for the dev stack.
      Seed__DemoData: ${SEED_DEMO_DATA:-true}
      # No Email__*, FileAnalysis__* or FileStorage__* here. Those settings are database-backed and
      # edited at /settings; the migrations job used to read them for SystemSettingsConfigAdoption,
      # which carried a pre-existing configured value into the store on upgrade. That step is gone —
      # no deployment ever ran the releases it existed to upgrade from — so the job needs none of
      # them. The API still reads the ones with a startup role (the mail transport, the upload
      # transport ceiling); see the api service below.

      # The initial administrator (issue #290). Applied ONLY when the user table is completely empty;
      # ignored on every later deploy. Required on a fresh database unless demo seeding provides an
      # admin — the job exits non-zero if neither does, and the API does not start behind it.
      Bootstrap__Admin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__Admin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ConnectionStrings__OdysseyConnection: server=mariadb;port=3306;database=${ODYSSEY_DATABASE:-odyssey};user=${MARIADB_USER:-odyssey};password=${MARIADB_PASSWORD:-odyssey_password};
      # No DataProtection__KeysPath and no keys volume, deliberately (issue #444 §14, revisited).
      # Nothing in this job reads or writes a protected value, and mounting the ring here would let a
      # second container decrypt every stored credential for nothing. If a step here ever needs to
      # protect a value, mount the volume again AND give it the same DataProtection__KeysPath — a job
      # that protects a row under its own ephemeral ring writes one the API can never decrypt.
    depends_on:
      mariadb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Odyssey.Api/Dockerfile
    container_name: odyssey-api
    restart: unless-stopped
    environment:
      # Default to Development so CORS is enabled and HTTPS redirection is not enforced in local/dev environments.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      UseInMemoryDatabase: ${USE_IN_MEMORY_DATABASE:-false}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      ConnectionStrings__OdysseyConnection: server=mariadb;port=3306;database=${ODYSSEY_DATABASE:-odyssey};user=${MARIADB_USER:-odyssey};password=${MARIADB_PASSWORD:-odyssey_password};
      # There is NO Email__* here any more (issue #8). The relay credential moved to the encrypted
      # secret store in #445; the transport around it — host, port, STARTTLS — and the public link
      # origin followed it into the database-backed settings store in #8, so all of them are edited at
      # /settings and none of them is readable from configuration.
      #
      # The #421 Non-Goal that kept the transport here (a writable host harvests the relay credential,
      # because the sender connects and THEN authenticates) is closed structurally instead: changing
      # the host, or turning STARTTLS off, clears the stored credential in the same transaction.
      #
      # The dev stack still gets working confirmation and reset links with no variable: DemoDataSeeder
      # seeds EmailClientBaseUrl, falling back to http://localhost:5199 — the port pinned by the client
      # service below.
      # Legal__PseudonymizationSecret and FileAnalysis__ApiKey are GONE (issue #445 Waves 1 and 4).
      # Both live in the encrypted secret store now and are entered at /settings → Credentials. There
      # is no configuration path back to them: carrying a secret across from configuration would leave
      # the plaintext in the environment, which is most of what the move exists to escape.
      #
      # The pseudonymization secret is a DERIVATION key — outside Production an unset one still falls
      # back to the fixed development value, so this dev stack's delete flow works out of the box.

      # The upload TRANSPORT ceiling (issue #421 Wave 4). The cap a user is validated against is
      # admin-editable in System Settings; this is the startup limit for Kestrel and the multipart
      # reader, and the bound the setting cannot be raised above. Keep the reverse proxy's body-size
      # limit at or above it — see docs/deployment.md.
      FileStorage__MaxFileSizeBytes: ${FILE_UPLOAD_MAX_BYTES:-67108864}
      # The Data Protection key ring (issue #444). The DEV stack had none at all before this, so every
      # developer machine ran an ephemeral ring — which is why the ephemeral write refusal is on the
      # write path rather than being a startup warning nobody would see. The volume is SECRET-BEARING
      # once a credential is stored: back it up, back it up separately from the database dump, and note
      # that `docker compose down -v` destroys it (for a derivation key, un-recoverably).
      DataProtection__KeysPath: /var/odyssey/dataprotection-keys
      # Headroom for the E2E suites, which drive this stack from one address — one rate-limit
      # partition key. The shipped default in appsettings.json is 30 requests per minute per IP and
      # STAYS 30 in production — but only because the prod overlay `!reset`s this key back out.
      # Compose MERGES environment maps, so a dev-only relaxation set here reaches production unless
      # the overlay removes it; that reset and this line have to be read together.
      #
      # 30 is not sized for a browser-driven test stack. The identity policy covers the WHOLE
      # MapIdentityApi group, /manage/* included (Program.cs), and the Blazor client calls
      # GET manage/info to resolve auth state on sign-in and on navigation — so a browser test costs
      # many permits, not the one its single login suggests. Measured against this stack:
      # Odyssey.E2ETests alone spends the entire 30-permit window in a 9-second run, and
      # Odyssey.E2ETests.Api another 6. The E2E workflow runs the two back to back inside one
      # 60-second window, and `dotnet test Odyssey.sln` runs them at once; either way the second
      # suite is answered with 429s — the API suite as "Login failed: RateLimited", the browser suite
      # as a login navigation timeout, which is the least debuggable shape the failure could take.
      #
      # Raising it here rather than in the fixtures leaves the control itself alone. The limiter's
      # real behaviour — that it rejects, at what count, with what body, and that the tighter mail
      # window rides on top of it — is covered at the API tier with its own configuration, by
      # IdentityRateLimitingTests, IdentityEmailRateLimitingTests and
      # IdentityMailEndpointConventionTests. The E2E suites do not test the limiter; they were only
      # ever incidentally constrained by it.
      #
      # RateLimiting__IdentityEmail__PermitLimit is deliberately NOT raised: no E2E test touches the
      # two mail-sending routes, and that limit is the one whose cost is outbound mail, not CPU.
      RateLimiting__Identity__PermitLimit: ${IDENTITY_RATE_LIMIT:-300}
    volumes:
      - dataprotection_keys:/var/odyssey/dataprotection-keys
    ports:
      # Loopback-only — see the mariadb service above (issue #451 §1.2).
      - "127.0.0.1:5188:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully

  # Background jobs (issue #348 first): the weather schedule, and every job added after it. No port and
  # no HTTP surface. Every replica runs every job; a job coordinates through the rows it works on, so
  # scaling this service out is safe.
  worker:
    build:
      context: .
      dockerfile: Odyssey.Worker/Dockerfile
    container_name: odyssey-worker
    restart: unless-stopped
    environment:
      # The generic host reads DOTNET_ENVIRONMENT; it must match the API's, because the secret registry's
      # environment filter decides which stored secrets exist at all.
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__OdysseyConnection: server=mariadb;port=3306;database=${ODYSSEY_DATABASE:-odyssey};user=${MARIADB_USER:-odyssey};password=${MARIADB_PASSWORD:-odyssey_password};
      # The API's key ring, READ-ONLY (`:ro` below), so a job can read the encrypted secret store — the
      # Frost client id today. This makes the worker the second container that can decrypt every stored
      # credential, a deliberate trade-off (docs/deployment.md). It never writes a key: automatic key
      # generation is off in WorkerHost, so the API stays the only writer.
      DataProtection__KeysPath: /var/odyssey/dataprotection-keys
    volumes:
      - dataprotection_keys:/var/odyssey/dataprotection-keys:ro
    # The same hardening as docker-compose.prod.yml, since the worker needs none of what it removes: a
    # non-root app with no port, no capabilities and nothing to write outside /tmp. Keeping dev identical
    # means a job that starts needing more fails here first, not in production.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      migrations:
        condition: service_completed_successfully
      # After the API, so a fresh keys volume is initialised from the API's image, which owns the
      # directory as `app` and is the one container allowed to write it.
      api:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: Odyssey.Client/Dockerfile
    container_name: odyssey-client
    restart: unless-stopped
    ports:
      # Loopback-only — see the mariadb service above (issue #451 §1.2).
      - "127.0.0.1:5199:8080"
    depends_on:
      - api

volumes:
  mariadb_data:
  # Mounted read-write by the api service and READ-ONLY by the worker (issue #444 §14, revisited for
  # issue #348): those two containers, and only those, can decrypt what is stored under it. The
  # migrations job protects nothing and still does not mount it.
  dataprotection_keys:
