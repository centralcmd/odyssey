version: 2
updates:
  # .NET packages — versions are centrally managed in Directory.Packages.props.
  # NOT covered here: Aspire.AppHost.Sdk, which is an MSBuild `Sdk=` attribute on
  # Odyssey.AppHost/Odyssey.AppHost.csproj rather than a PackageReference. The nuget
  # ecosystem does not read it, so that one has to be bumped by hand.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      microsoft-aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.NET.*"
          - "Microsoft.Extensions.*"
        # "Microsoft.NET.*" matches exactly two packages, and they belong to different groups:
        # Microsoft.NET.Sdk.WebAssembly.Pack (client, stays here) and Microsoft.NET.Test.Sdk
        # (declared under `test` below). A dependency matching two groups is opened in BOTH, so
        # that one bump arrived twice — once inside this group and once on its own. Excluding it
        # here rather than dropping it from `test` keeps the tooling bump with the rest of the
        # test stack, where a runner change is reviewed against the suites it runs.
        exclude-patterns:
          - "Microsoft.NET.Test.Sdk"
      swashbuckle:
        patterns:
          - "Swashbuckle.*"
      test:
        patterns:
          - "xunit*"
          - "Moq"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # Block only the EF Core 10 major — Pomelo.EntityFrameworkCore.MySql 9.0.0 (still the
      # latest stable) requires EF Core 9.x. Without update-types these entries also swallowed
      # every 9.0.x patch, which is how the repo drifted from 9.0.13 to six patches behind.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.Identity.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      # Pinned to MessagePack 2.5.x for StreamJsonRpc compatibility (Aspire.Hosting
      # -> StreamJsonRpc 2.22.x targets MessagePack 2.x); 2.5.301 already patches
      # GHSA-hv8m-jj95-wg3x, so a 3.x major bump is unneeded and risks runtime breakage
      - dependency-name: "MessagePack"
        update-types: ["version-update:semver-major"]
      # The solution targets net10.0. These packages version with the .NET runtime, so their next
      # major is .NET 11: the WebAssembly pack's 11.x build tasks do not load under the .NET 10 SDK,
      # and the rest pull .NET 11 assemblies into net10.0 apps. Moving to .NET 11 is a deliberate
      # TargetFramework + SDK + base-image change, not a Dependabot bump.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Sdk.WebAssembly.Pack"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used across the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images — one Dockerfile per service
  - package-ecosystem: "docker"
    directories:
      - "/Odyssey.Api"
      - "/Odyssey.Client"
      - "/Odyssey.MigrationService"
      - "/Odyssey.Worker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # The .NET images track the target framework (net10.0): an aspnet:11.0 runtime cannot start a
      # net10.0 app. Move them with the TargetFramework, not on their own.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
