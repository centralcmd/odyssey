name: Publish images

# Reusable workflow that builds and pushes the three container images to GHCR.
# Called from release-please.yml when a release is cut: it stamps the immutable
# SemVer tag alongside the floating `latest` and the long sha. Images are only
# published for releases — pushes to main run build-and-test only, never publish.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (sha or tag) to check out and build from.
        type: string
        required: true
      version:
        description: SemVer to tag the images with (e.g. 1.2.3). Empty for continuous builds.
        type: string
        required: false
        default: ''

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Serialize publishing per ref *and per image* so an in-flight older build can't
    # push the mutable `latest` tag after a newer commit has already published it. The
    # matrix image must be part of the group, otherwise the three matrix legs share one
    # group and cancel each other.
    concurrency:
      group: publish-images-${{ inputs.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Odyssey.Api/Dockerfile
          - image: client
            dockerfile: Odyssey.Client/Dockerfile
          - image: migrations
            dockerfile: Odyssey.MigrationService/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          # `latest` and the long sha track every build; the raw SemVer tag is only
          # emitted when a release supplies `version`, giving immutable, pinnable tags.
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
