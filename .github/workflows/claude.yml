name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialize every Claude run on one issue or PR, so two invocations on the same thread
# cannot run concurrently and race each other's commits. The group name is shared with
# Claude Code Review on purpose: a `@claude review` and a bare `@claude` on the same PR
# both push to the same branch, and separate groups would let them collide.
#
# Deliberately NOT cancel-in-progress. Every trigger here is a maintainer's comment, and
# cancelling would drop that request silently, leaving no reply on the thread. The author
# gate on the job below already stops outsiders queueing runs at all, so this is about
# ordering, not about runner budget.
#
# `issue.number` covers issue_comment and issues; `pull_request.number` covers
# pull_request_review and pull_request_review_comment.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # On a PR comment, `@claude review` is handled by the Claude Code Review
    # workflow, so skip it here to avoid double-firing. A bare `@claude` (and
    # `@claude review` on a non-PR issue) still runs the general agent.
    #
    # Author gate: only the owner, org members and collaborators can invoke Claude.
    # This job carries CLAUDE_CODE_OAUTH_TOKEN, so on a public repo an ungated trigger
    # would let any GitHub user spend the subscription and feed attacker-authored text
    # to the agent. Each event is checked against its OWN association field on purpose:
    # for issue_comment, github.event.issue.author_association describes the *issue*
    # author, so ORing the fields would let an outsider trigger merely by commenting on
    # a maintainer's issue. Same reason the `issues` clause gates on the issue author --
    # to run Claude on an outsider's report, a maintainer comments `@claude` on it.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude') &&
        !(github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude review'))) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1.0.214
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Read-only tools only, for the reason spelled out in claude-code-review.yml: the
          # author gate above filters who can *invoke* the agent, not what it then reads. The
          # documented path for an outsider's issue is a maintainer commenting `@claude` on it
          # (see the note above), so attacker-authored issue and PR text reaches the agent while
          # it holds CLAUDE_CODE_OAUTH_TOKEN. No bare Bash, no Write/Edit, no WebFetch, so an
          # injected instruction has no arbitrary-execution primitive and no egress channel.
          #
          # This job already carries only read scopes, so it could never push a change anyway;
          # what the allow-list actually costs is the ability to run a build or test suite to
          # inform an answer. That is the deliberate trade. Widening it means adding a specific
          # prefix pattern here -- never a bare `Bash`.
          #
          # No `prompt:` is set, so this is tag mode: the comment and CI MCP servers are
          # installed regardless, but the agent may still only call what is listed here, hence
          # the explicit mcp__ entries. Without the github_ci ones the `actions: read`
          # permission above would be inert.
          claude_args: |
            --allowed-tools "Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),mcp__github_comment__update_claude_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

