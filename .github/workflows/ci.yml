name: CI

# Runs post-merge on main, and on every pull request so outside contributions get
# validated before review. Nothing auto-deploys (images publish on release tags,
# deploys are on-demand), so a transiently-red main never reaches prod — it's fixed
# forward before a release.
#
# `pull_request` (never `pull_request_target`) is deliberate: fork code must run in a
# context with no access to repository secrets. The coverage-badge step needs
# GIST_TOKEN and is therefore gated to push events below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per pull request, one per push to main. A pull_request run is cancelled when a
# newer push supersedes it: this workflow does a full Release build plus the whole
# solution, including the Testcontainers-MariaDB tier that genuinely executes on the
# runner, so on a public repo superseded runs are the cheapest way for a drive-by to
# exhaust the runner budget. Pushes to main are NOT cancelled — every commit that lands
# gets validated on its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Coverage is collected only on a push to main: the coverage-badge job is its only consumer, and
# instrumentation roughly doubles the API tier's wall time (126 s to 257 s measured locally), so a PR
# paid for numbers nothing read.
env:
  COLLECT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # The fast suites and the MariaDB tier run as two parallel jobs rather than one serial job: the
  # Testcontainers tier is the longest single project, and putting it on its own runner lets the
  # rest of the solution finish beside it instead of queueing behind it.
  fast-tests:
    name: Build and fast tests
    runs-on: ubuntu-latest
    # Without a ceiling a hung test holds the runner for GitHub's 6-hour default and every later PR
    # waits behind it (main from fa098ef on).
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Odyssey.sln

      # Whitespace and layout per .editorconfig (indentation, line breaks, final newline). Code-style
      # and naming rules are already enforced by the build (EnforceCodeStyleInBuild), so only the
      # whitespace pass runs here. It does not cover .razor files. Fix locally with:
      #   dotnet format whitespace Odyssey.sln
      - name: Check formatting
        run: dotnet format whitespace Odyssey.sln --verify-no-changes

      # -warnaserror on top of the solution-wide <TreatWarningsAsErrors> in
      # Directory.Build.props: that property covers compiler and NuGet warnings, but not
      # MSBuild *task* warnings such as MSB3277 (unresolvable reference-version conflicts),
      # which only this switch promotes. The build is kept at zero warnings, so both apply.
      # This job builds the whole solution, so it is also the one that holds that line.
      - name: Build
        run: dotnet build Odyssey.sln -c Release --no-restore -warnaserror

      # Every project in the solution except the MariaDB tier, which the integration job runs. The
      # filter is derived from the solution rather than listed by hand, so a new test project is
      # picked up here without an edit. The E2E tiers have no stack here and self-skip, as before.
      - name: Write the solution filter
        run: |
          dotnet sln Odyssey.sln list | tail -n +3 \
            | grep -v '^Odyssey.IntegrationTests/' \
            | jq -R . | jq -s '{solution: {path: "Odyssey.sln", projects: .}}' > fast-tests.slnf
          cat fast-tests.slnf

      # --blame-hang-timeout ends a test that runs 15 minutes and records which one in the uploaded
      # Sequence file, instead of a silent stall until timeout-minutes.
      - name: Test
        run: >-
          dotnet test fast-tests.slnf --no-build -c Release
          --blame-hang-timeout 15m --blame-hang-dump-type none
          --logger "trx;LogFilePrefix=test-results"
          ${{ env.COLLECT_COVERAGE == 'true' && '--collect:"XPlat Code Coverage" --settings coverage.runsettings' || '' }}
          --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-fast
          # The blame collector's Sequence file names the test that was running when a hang was cut off.
          path: |
            **/*.trx
            **/Sequence_*.xml
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.COLLECT_COVERAGE == 'true'
        with:
          name: coverage-fast
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  integration-tests:
    name: Integration tests (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pulled before the build so a Docker Hub rate-limit (429) is retried here, with a clear log,
      # rather than surfacing as a fixture failure mid-run. The tag is read from MariaDbFixture so it
      # cannot drift from the one the tests start.
      - name: Pre-pull the MariaDB image
        run: |
          image=$(grep -oP 'const string Image = "\K[^"]+' Odyssey.IntegrationTests/MariaDbFixture.cs)
          test -n "$image"
          for attempt in 1 2 3 4; do
            docker pull "$image" && exit 0
            echo "Pull of $image failed (attempt $attempt); retrying."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Odyssey.IntegrationTests

      - name: Build
        run: dotnet build Odyssey.IntegrationTests -c Release --no-restore

      # The MariaDB tier self-skips when Docker is absent. Requiring it turns that skip into a
      # failure, so this job cannot go green having run none of it (issue #257).
      - name: Test
        env:
          ODYSSEY_REQUIRE_TIER: integration
        run: >-
          dotnet test Odyssey.IntegrationTests --no-build -c Release
          --blame-hang-timeout 15m --blame-hang-dump-type none
          --logger "trx;LogFilePrefix=test-results"
          ${{ env.COLLECT_COVERAGE == 'true' && '--collect:"XPlat Code Coverage" --settings coverage.runsettings' || '' }}
          --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-integration
          path: |
            **/*.trx
            **/Sequence_*.xml
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.COLLECT_COVERAGE == 'true'
        with:
          name: coverage-integration
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  coverage-badge:
    name: Coverage badge
    runs-on: ubuntu-latest
    needs: [fast-tests, integration-tests]
    # Only publish the badge on a merge/push to main, never on pull requests
    # (forks/PRs don't have access to the gist secret). The COVERAGE_GIST_ID
    # guard skips this job until the gist is configured, so it never reds main.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.COVERAGE_GIST_ID != ''
    permissions:
      contents: read

    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Generate coverage summary
        # SHA-pinned: this job holds GIST_TOKEN, so a moved tag on a community
        # action would run unreviewed code with a write-scoped credential.
        # Dependabot's github-actions ecosystem keeps the pin current.
        uses: danielpalme/ReportGenerator-GitHub-Action@70c37c4d588cff5bf9cf190830c6f01dfcfb884b # v5.6.1
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: JsonSummary
          # Exclude generated code (EF migrations, source generators) so the
          # badge reflects coverage of hand-written code.
          filefilters: -*Migrations*;-*.g.cs;-*.Designer.cs;-*GlobalUsings*

      - name: Extract line coverage
        id: cov
        run: |
          pct=$(jq -r '.summary.linecoverage' coverage-report/Summary.json)
          echo "percent=${pct}" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${pct}%"

      # Push-only: fork pull requests have no access to GIST_TOKEN, and a PR must not
      # move the badge that reports main's coverage.
      - name: Publish coverage badge to gist
        if: github.event_name == 'push'
        # SHA-pinned for the same reason — this step is the one that receives GIST_TOKEN.
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: odyssey-coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.percent }}%
          valColorRange: ${{ steps.cov.outputs.percent }}
          minColorRange: 50
          maxColorRange: 90
