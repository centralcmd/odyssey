name: E2E

# Manual-only: the Playwright end-to-end smoke flow is heavy (full image build + browser), so
# it runs on demand via the "Run workflow" button rather than automatically. It stands up the
# full Docker stack (seeded with demo data), drives it in a real browser, then tears it down.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the client to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5199 >/dev/null 2>&1; then
              echo "Client is up."
              exit 0
            fi
            echo "Waiting for client... ($i)"
            sleep 5
          done
          echo "Client did not become ready in time."
          exit 1

      - name: Run browser E2E tests
        env:
          E2E_BASE_URL: http://localhost:5199
        run: >-
          dotnet test Odyssey.E2ETests -c Release
          --logger "trx;LogFilePrefix=e2e-results"
          --results-directory ./TestResults

      - name: Run API E2E tests
        env:
          E2E_API_BASE_URL: http://localhost:5188
        run: >-
          dotnet test Odyssey.E2ETests.Api -c Release
          --logger "trx;LogFilePrefix=e2e-api-results"
          --results-directory ./TestResults

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

      - name: Upload E2E results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-results
          path: "**/*.trx"
          retention-days: 7
